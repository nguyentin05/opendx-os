# Add after compose.rag.yaml for pgvector and deployment-controlled model configuration.
x-model-runtime: &model-runtime
  AI_GATEWAY_DATABASE_URL: postgres://dxos_ai_gateway:${AI_GATEWAY_DATABASE_PASSWORD:?set the Gateway database password}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
  # The one reviewed declaration and the private proxy it renders. There is no
  # runtime catalog and no separate model qualification flag: an unreconciled or
  # withdrawn selection boots with model calls unavailable and FTS intact.
  RAG_MODEL_DEPLOYMENT_FILE: /run/secrets/model-catalog
  RAG_MODELS_ENABLED: ${RAG_MODELS_ENABLED:-false}
  RAG_MODEL_LITELLM_ENDPOINT: ${RAG_MODEL_LITELLM_ENDPOINT:-http://litellm:4000}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
  RAG_MODEL_LITELLM_CONFIG_FILE: ${RAG_MODEL_LITELLM_CONFIG_FILE:-}
  RAG_LOCAL_MODELS_QUALIFIED: ${RAG_LOCAL_MODELS_QUALIFIED:-false}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      AI_GATEWAY_DATABASE_PASSWORD: ${AI_GATEWAY_DATABASE_PASSWORD}
      RAG_MODELS_SCHEMA_ENABLED: ${RAG_MODELS_SCHEMA_ENABLED:-false}
      RAG_GLOBAL_MODEL_REGISTRY_SCHEMA_ENABLED: ${RAG_GLOBAL_MODEL_REGISTRY_SCHEMA_ENABLED:-false}
      RAG_AGENT_MODELS_SCHEMA_ENABLED: ${RAG_AGENT_MODELS_SCHEMA_ENABLED:-false}
  cap-ai:
    environment: *model-runtime
    env_file: &credentials
      - ${RAG_MODEL_CREDENTIAL_ENV_FILE:?set the path to a private file containing only catalog credential references and their values}
    secrets: [model-catalog]
  cap-ai-worker:
    environment: *model-runtime
    env_file: *credentials
    secrets: [model-catalog]

secrets:
  model-catalog:
    file: ${RAG_MODEL_CATALOG_FILE:?set the deployment catalog path}
