# Aggregated into the built-in edit role: manage DXApplication resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dxos-operator
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: dxapplication-editor-role
rules:
- apiGroups: ["dxos.io"]
  resources: ["dxapplications"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["dxos.io"]
  resources: ["dxapplications/status"]
  verbs: ["get"]
