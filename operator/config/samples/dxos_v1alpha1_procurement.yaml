apiVersion: dxos.io/v1alpha1
kind: DXApplication
metadata:
  name: procurement
spec:
  attachments:
  - column: quote_file_id
    requireCleanOnCommands:
    - submit
    - approve
    - approve_budget
  capabilities:
  - cap-process
  - cap-hr
  - cap-work
  displayName: Material Procurement
  domainAccess:
    insert:
    - columns:
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      role: role_procurement_requester
    select:
    - columns:
      - id
      - created_by
      - org_unit_id
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      - rejection_reason
      - status
      - version
      - created_at
      - updated_at
      role: role_procurement_requester
      scope: own
    - columns:
      - id
      - created_by
      - org_unit_id
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      - rejection_reason
      - status
      - version
      - created_at
      - updated_at
      role: role_procurement_manager
      scope: department
    - columns:
      - id
      - created_by
      - org_unit_id
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      - rejection_reason
      - status
      - version
      - created_at
      - updated_at
      recordFilter:
        status:
          _neq: DRAFT
      role: role_procurement_finance
      scope: organization
    update:
    - columns:
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      role: role_procurement_requester
      scope: own
  domainTable:
    columns:
    - check: length(trim(vendor_name)) > 0
      name: vendor_name
      nullable: false
      type: text
    - check: length(trim(item_description)) > 0
      name: item_description
      nullable: false
      type: text
    - check: quoted_amount > 0
      name: quoted_amount
      nullable: false
      type: numeric(14,2)
    - name: quote_file_id
      nullable: true
      type: uuid
    - name: rejection_reason
      nullable: true
      type: text
    foreignKeys:
    - column: quote_file_id
      references: core.files
    name: domain.procurement_requests
  roles:
  - description: Creates and submits purchase requests
    name: role_procurement_requester
  - description: Approves the purchase requests of their own department
    name: role_procurement_manager
  - description: Reviews the budget of requests approved by a department
    name: role_procurement_finance
  sharedAccess:
  - columns:
    - id
    - display_name
    - email
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    table: core.users
  - columns:
    - id
    - code
    - name
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    table: cap_hr.org_units
  - columns:
    - id
    - file_name
    - scan_status
    - sha256_hash
    - scanned_at
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    table: core.files
  stateMachine:
    commands:
    - allowedRoles:
      - role_procurement_requester
      from:
      - DRAFT
      name: submit
      to: SUBMITTED
    - allowedRoles:
      - role_procurement_manager
      from:
      - SUBMITTED
      name: approve
      recordFilter:
        created_by:
          _neq: X-Hasura-User-Id
      to: BUDGET_REVIEW
    - allowedRoles:
      - role_procurement_finance
      from:
      - BUDGET_REVIEW
      name: approve_budget
      recordFilter:
        created_by:
          _neq: X-Hasura-User-Id
      to: APPROVED
    - allowedRoles:
      - role_procurement_manager
      - role_procurement_finance
      from:
      - SUBMITTED
      - BUDGET_REVIEW
      name: reject
      to: REJECTED
    - allowedRoles:
      - role_procurement_requester
      from:
      - DRAFT
      - SUBMITTED
      name: cancel
      to: CANCELLED
    editableStates:
    - DRAFT
    initial: DRAFT
    terminalStates:
    - APPROVED
    - REJECTED
    - CANCELLED
  uiSchema:
    actions:
    - submit
    - approve
    - approve_budget
    - reject
    - cancel
    formFields:
    - label: Vendor Name
      name: vendor_name
      required: true
      type: text
    - label: Item Description
      name: item_description
      required: true
      type: text
    - label: Quoted Amount
      name: quoted_amount
      required: true
      type: number
    - label: Supplier Quote File
      name: quote_file_id
      required: false
      type: file
    listColumns:
    - vendor_name
    - item_description
    - quoted_amount
    - quote_file_id
    - status
    - version
    - updated_at
  version: 0.2.0
  workflows:
  - definition: |
      # SPDX-License-Identifier: Apache-2.0
      # Copyright 2026 DX-OS Open-Core Contributors
      # Import and verify against the deployed Kestra plugin version before enabling.
      id: procurement_approval_flow
      namespace: dxos.apps.procurement
      triggers:
        - id: command_webhook
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('DXOS_WEBHOOK_KEY') }}"
      tasks:
        - id: submit_only
          type: io.kestra.plugin.core.flow.If
          condition: "{{ trigger.body.app_id == 'procurement' and trigger.body.payload.command == 'submit' }}"
          then:
            - id: create_review
              type: io.kestra.plugin.core.http.Request
              uri: "{{ secret('DXOS_PROCESS_URL') }}/api/cap/process/effects/work-item"
              method: POST
              contentType: application/json
              headers:
                Authorization: "Bearer {{ secret('DXOS_WORKFLOW_TOKEN') }}"
                X-Hasura-Role: role_workflow
                Idempotency-Key: "{{ trigger.body.event_id }}:create_review"
              body: |
                {"event_id":"{{ trigger.body.event_id }}","step_name":"create_review"}
    effects:
    - fields:
        description: Review the submitted request in its source application.
        priority: MEDIUM
        title: Review procurement request
      kind: create_work_item
      stepName: create_review
      whenCommands:
      - submit
    file: workflows/procurement_flow.yaml
    id: procurement_approval_flow
    subscribedEvents:
    - command.committed
