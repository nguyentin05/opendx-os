# Local development overlay: image built by scripts/k8s/dev-cluster.sh and a short
# drift-repair period so manual changes are visibly repaired during a demo.
resources:
- ../default
images:
- name: controller
  newName: dxos-operator
  newTag: dev
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --requeue-interval=20s
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
