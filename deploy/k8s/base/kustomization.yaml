# The whole platform for any Kubernetes cluster, by tier (docs/architecture):
#   platform/      Tier 1, shared infrastructure, namespace dxos
#   capabilities/  Tier 2, capability services and the App Shell, namespace dxos
#   dxos-controller Tier 1 as well, in dxos-operator-system; it installs
#                   Tier 3 applications declared as DXApplication resources
# deploy/k8s/apply.sh creates the Secrets (dxos-secrets, seaweedfs-s3,
# dxos-operator-config) first. No public entry point: an overlay adds one.
resources:
- namespace.yaml
- platform
- capabilities
- ../../../operator/config/default
# Public, non-secret settings. The defaults match Compose on localhost; an
# overlay replaces them with the deployment's own origins.
configMapGenerator:
- name: dxos-public
  namespace: dxos
  literals:
  - KEYCLOAK_HOSTNAME=http://localhost:8085
  - OIDC_ISSUER_URL=http://localhost:8085/realms/dxos
  - DXOS_OIDC_ORIGIN=http://localhost:8085
  - KESTRA_USER=admin@dxos.local
  - BOOTSTRAP_OPERATOR_EMAIL=
images:
- name: controller
  newName: ghcr.io/nguyentin05/opendx-dxos-controller
  newTag: main
- name: opendx-dxos-authz
  newName: ghcr.io/nguyentin05/opendx-dxos-authz
  newTag: main
- name: opendx-cap-hr
  newName: ghcr.io/nguyentin05/opendx-cap-hr
  newTag: main
- name: opendx-cap-process
  newName: ghcr.io/nguyentin05/opendx-cap-process
  newTag: main
- name: opendx-workspace-ui
  newName: ghcr.io/nguyentin05/opendx-workspace-ui
  newTag: main
