  migrations__core__0004_attachment_refusal.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Hasura hides insufficient_privilege behind "database query error". A check
    -- violation passes the original message through as permission-error, while the
    -- message text clients match stays unchanged.
    CREATE OR REPLACE FUNCTION core.enforce_attachments()
    RETURNS TRIGGER LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    DECLARE
        v_actor UUID := core.session_actor_id();
        v_new JSONB := to_jsonb(NEW);
        v_old JSONB;
        v_column TEXT;
        v_file TEXT;
    BEGIN
        IF TG_OP = 'UPDATE' THEN
            v_old := to_jsonb(OLD);
        END IF;
        FOR i IN 1 .. TG_NARGS - 1 LOOP
            v_column := TG_ARGV[i];
            v_file := v_new ->> v_column;
            IF v_file IS NULL OR (v_old IS NOT NULL AND (v_old ->> v_column) IS NOT DISTINCT FROM v_file) THEN
                CONTINUE;
            END IF;
            IF v_actor IS NULL OR NOT EXISTS (
                SELECT 1 FROM core.files f
                 WHERE f.id = v_file::uuid AND f.app_id = TG_ARGV[0] AND f.uploaded_by = v_actor
            ) THEN
                RAISE EXCEPTION 'attachment %: only a file you uploaded to this application can be attached', v_column
                    USING ERRCODE = 'check_violation';
            END IF;
        END LOOP;
        RETURN NEW;
    END;
    $$;

    REVOKE ALL ON FUNCTION core.enforce_attachments() FROM PUBLIC;
  migrations__core__0005_parent_refusal.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Hasura hides insufficient_privilege behind "database query error". A check
    -- violation passes the original message through as permission-error. The
    -- dynamic status is at the end, after the stable prefix clients match.
    CREATE OR REPLACE FUNCTION core.enforce_parent()
    RETURNS TRIGGER LANGUAGE plpgsql AS $$
    DECLARE
        v_parent UUID;
        v_status TEXT;
        v_found BOOLEAN;
    BEGIN
        IF TG_OP = 'DELETE' THEN
            v_parent := (to_jsonb(OLD) ->> TG_ARGV[1])::uuid;
        ELSE
            v_parent := (to_jsonb(NEW) ->> TG_ARGV[1])::uuid;
            IF TG_OP = 'UPDATE' AND v_parent IS DISTINCT FROM (to_jsonb(OLD) ->> TG_ARGV[1])::uuid THEN
                RAISE EXCEPTION 'a row cannot move to another parent record'
                    USING ERRCODE = 'check_violation';
            END IF;
        END IF;

        EXECUTE format('SELECT true, to_jsonb(p) ->> ''status'' FROM %s p WHERE p.id = $1 FOR UPDATE', TG_ARGV[0]::regclass)
            INTO v_found, v_status USING v_parent;
        IF v_found IS NOT TRUE THEN
            RAISE EXCEPTION 'parent record % not found', v_parent USING ERRCODE = 'foreign_key_violation';
        END IF;
        IF TG_NARGS > 2 THEN
            v_found := false;
            FOR i IN 2 .. TG_NARGS - 1 LOOP
                v_found := v_found OR v_status = TG_ARGV[i];
            END LOOP;
            IF NOT v_found THEN
                RAISE EXCEPTION 'the parent record can no longer be changed (status %)', v_status
                    USING ERRCODE = 'check_violation';
            END IF;
        END IF;

        IF TG_OP = 'DELETE' THEN
            RETURN OLD;
        END IF;
        RETURN NEW;
    END;
    $$;
  migrations__core__0006_runtime_statement_limits.sql: |
    -- SPDX-License-Identifier: Apache-2.0
