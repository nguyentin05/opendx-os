  migrations__core__0003_publication_generation.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors
    ALTER TABLE core.apps ADD COLUMN IF NOT EXISTS publication_generation BIGINT NOT NULL DEFAULT 0 CHECK (
        publication_generation >= 0
    );

    CREATE OR REPLACE FUNCTION core.claim_knowledge_publication(
        token UUID
    ) RETURNS JSONB
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog,
    core,
    public AS $$
    DECLARE event core.outbox_events;publication jsonb;
    BEGIN
     SELECT * INTO event FROM core.outbox_events WHERE event_type='knowledge.publication'
     AND ((delivery_status='pending' AND next_attempt_at<=now()) OR(delivery_status='in_flight' AND lease_until<=now()))
     ORDER BY created_at,id FOR UPDATE SKIP LOCKED LIMIT 1;
     IF NOT FOUND THEN RETURN NULL;END IF;
     UPDATE core.outbox_events SET delivery_status='in_flight',attempt_count=attempt_count+1,lease_token=token,lease_until=now()+interval '45 seconds' WHERE id=event.id;
     SELECT spec->'_publication' INTO publication FROM core.apps WHERE app_id=event.app_id;
     RETURN jsonb_build_object('event_id',event.id,'app_id',event.app_id,'publication_generation',publication->'generation','spec_digest',publication->'spec_digest');
    END $$;
    CREATE OR REPLACE FUNCTION core.ack_knowledge_publication(
        event UUID, token UUID, success BOOLEAN
    ) RETURNS BOOLEAN
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog,
    core,
    public AS $$
    BEGIN
     UPDATE core.outbox_events SET delivery_status=CASE WHEN success THEN 'delivered' ELSE 'pending' END,lease_token=NULL,lease_until=NULL,
     delivered_at=CASE WHEN success THEN now() ELSE NULL END,next_attempt_at=now()+make_interval(secs=>least(300,5*power(2,least(attempt_count,6)))::double precision),last_error=CASE WHEN success THEN NULL ELSE 'KNOWLEDGE_DELIVERY_UNAVAILABLE' END
     WHERE id=event AND event_type='knowledge.publication' AND delivery_status='in_flight' AND lease_token=token AND lease_until>now();
     RETURN FOUND;
    END $$;
    REVOKE ALL ON FUNCTION core.claim_knowledge_publication(UUID),
    core.ack_knowledge_publication(UUID, UUID, BOOLEAN) FROM public;
    DO $$ BEGIN
     IF EXISTS(SELECT FROM pg_roles WHERE rolname='dxos_ai_dispatcher') THEN
      GRANT USAGE ON SCHEMA core TO dxos_ai_dispatcher;
      GRANT EXECUTE ON FUNCTION core.claim_knowledge_publication(uuid),core.ack_knowledge_publication(uuid,uuid,boolean) TO dxos_ai_dispatcher;
     END IF;
    END $$;
  migrations__core__0004_attachment_refusal.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Hasura hides insufficient_privilege behind "database query error". A check
    -- violation passes the original message through as permission-error, while the
    -- message text clients match stays unchanged.
    CREATE OR REPLACE FUNCTION core.enforce_attachments()
    RETURNS TRIGGER LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    DECLARE
        v_actor UUID := core.session_actor_id();
        v_new JSONB := to_jsonb(NEW);
        v_old JSONB;
        v_column TEXT;
        v_file TEXT;
    BEGIN
        IF TG_OP = 'UPDATE' THEN
            v_old := to_jsonb(OLD);
        END IF;
        FOR i IN 1 .. TG_NARGS - 1 LOOP
            v_column := TG_ARGV[i];
            v_file := v_new ->> v_column;
            IF v_file IS NULL OR (v_old IS NOT NULL AND (v_old ->> v_column) IS NOT DISTINCT FROM v_file) THEN
                CONTINUE;
            END IF;
            IF v_actor IS NULL OR NOT EXISTS (
                SELECT 1 FROM core.files f
                 WHERE f.id = v_file::uuid AND f.app_id = TG_ARGV[0] AND f.uploaded_by = v_actor
            ) THEN
                RAISE EXCEPTION 'attachment %: only a file you uploaded to this application can be attached', v_column
                    USING ERRCODE = 'check_violation';
            END IF;
        END LOOP;
        RETURN NEW;
    END;
    $$;

    REVOKE ALL ON FUNCTION core.enforce_attachments() FROM PUBLIC;
  migrations__core__0005_parent_refusal.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Hasura hides insufficient_privilege behind "database query error". A check
    -- violation passes the original message through as permission-error. The
    -- dynamic status is at the end, after the stable prefix clients match.
    CREATE OR REPLACE FUNCTION core.enforce_parent()
    RETURNS TRIGGER LANGUAGE plpgsql AS $$
    DECLARE
        v_parent UUID;
        v_status TEXT;
        v_found BOOLEAN;
    BEGIN
        IF TG_OP = 'DELETE' THEN
            v_parent := (to_jsonb(OLD) ->> TG_ARGV[1])::uuid;
        ELSE
            v_parent := (to_jsonb(NEW) ->> TG_ARGV[1])::uuid;
            IF TG_OP = 'UPDATE' AND v_parent IS DISTINCT FROM (to_jsonb(OLD) ->> TG_ARGV[1])::uuid THEN
                RAISE EXCEPTION 'a row cannot move to another parent record'
                    USING ERRCODE = 'check_violation';
            END IF;
        END IF;

        EXECUTE format('SELECT true, to_jsonb(p) ->> ''status'' FROM %s p WHERE p.id = $1 FOR UPDATE', TG_ARGV[0]::regclass)
            INTO v_found, v_status USING v_parent;
        IF v_found IS NOT TRUE THEN
            RAISE EXCEPTION 'parent record % not found', v_parent USING ERRCODE = 'foreign_key_violation';
        END IF;
        IF TG_NARGS > 2 THEN
            v_found := false;
            FOR i IN 2 .. TG_NARGS - 1 LOOP
                v_found := v_found OR v_status = TG_ARGV[i];
            END LOOP;
            IF NOT v_found THEN
                RAISE EXCEPTION 'the parent record can no longer be changed (status %)', v_status
                    USING ERRCODE = 'check_violation';
            END IF;
        END IF;

        IF TG_OP = 'DELETE' THEN
            RETURN OLD;
        END IF;
        RETURN NEW;
    END;
    $$;
  migrations__core__0006_runtime_statement_limits.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Bound request-serving work. Background ingestion, the knowledge dispatcher,
    -- the model gateway and Kestra legitimately run longer operations and keep no
    -- limit. Roles may not exist in every installation. Existing connections keep
    -- their settings until the services reconnect.
    DO $$
    DECLARE r text;
    BEGIN
      FOREACH r IN ARRAY ARRAY['dxos_hasura','dxos_process','dxos_authz','dxos_hr','dxos_ai_api'] LOOP
        IF EXISTS (SELECT FROM pg_roles WHERE rolname=r) THEN
          EXECUTE format('ALTER ROLE %I SET statement_timeout = %L', r, '10s');
          IF r <> 'dxos_ai_api' THEN
            EXECUTE format('ALTER ROLE %I SET idle_in_transaction_session_timeout = %L', r, '30s');
          END IF;
        END IF;
      END LOOP;
    END $$;
  migrations__core__0007_work_item_source_version.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Work items created by a workflow effect record the source event version, so
    -- a later completion can close them and an older creation can be superseded.
    ALTER TABLE IF EXISTS cap_work.work_items ADD COLUMN IF NOT EXISTS source_version BIGINT;
  migrations__core__0008_account_status.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- dxos-authz mirrors the identity provider: an account disabled or deleted in
    -- Keycloak becomes DISABLED here (never deleted: records and audit refer to it),
    -- and dxos-authz refuses it; an account enabled again becomes ACTIVE. Platform
    -- service accounts (@dxos.internal, created by 03_app_registry.sql, not all of
    -- them in Keycloak) are never changed. Each change is audited with the account
    -- itself as actor and the identity provider as acting role.
    CREATE OR REPLACE FUNCTION core.mirror_account_status(p_user UUID, p_enabled BOOLEAN)
    RETURNS BOOLEAN LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    DECLARE
        v_status TEXT := CASE WHEN p_enabled THEN 'ACTIVE' ELSE 'DISABLED' END;
        v_rows INTEGER;
    BEGIN
        IF session_user <> 'dxos_authz' THEN
            RAISE EXCEPTION 'untrusted database connection for account status';
        END IF;
        UPDATE core.users SET status = v_status
         WHERE id = p_user AND status <> v_status AND lower(email) NOT LIKE '%@dxos.internal';
        GET DIAGNOSTICS v_rows = ROW_COUNT;
        IF v_rows = 1 THEN
            INSERT INTO core.audit_logs (actor_id, acting_role, action, entity_type, entity_id, payload)
            VALUES (p_user, 'identity_provider', CASE WHEN p_enabled THEN 'ENABLE_ACCOUNT' ELSE 'DISABLE_ACCOUNT' END,
                    'core.users', p_user, jsonb_build_object('status', v_status));
        END IF;
        RETURN v_rows = 1;
    END;
    $$;
    REVOKE ALL ON FUNCTION core.mirror_account_status(UUID, BOOLEAN) FROM PUBLIC;
    DO $$
    BEGIN
        IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'dxos_authz') THEN
            GRANT EXECUTE ON FUNCTION core.mirror_account_status(UUID, BOOLEAN) TO dxos_authz;
        END IF;
    END $$;
  migrations__ledger.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors

    -- Both entry points execute this inside the migration transaction and lock.
    -- Existing unscoped Tier 1 versions belong to Core; retain their checksums.
    CREATE TABLE IF NOT EXISTS core.schema_migrations (
        scope TEXT NOT NULL DEFAULT 'core',
        version TEXT NOT NULL,
        checksum TEXT NOT NULL,
        applied_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (scope, version)
    );
    DO $$
    DECLARE legacy_primary_key TEXT;
    BEGIN
        IF NOT EXISTS (
            SELECT FROM information_schema.columns
            WHERE table_schema='core' AND table_name='schema_migrations' AND column_name='scope'
        ) THEN
            ALTER TABLE core.schema_migrations ADD COLUMN scope TEXT NOT NULL DEFAULT 'core';
            SELECT conname INTO legacy_primary_key FROM pg_constraint
            WHERE conrelid='core.schema_migrations'::regclass AND contype='p';
            IF legacy_primary_key IS NOT NULL THEN
                EXECUTE format('ALTER TABLE core.schema_migrations DROP CONSTRAINT %I', legacy_primary_key);
            END IF;
            ALTER TABLE core.schema_migrations ADD PRIMARY KEY (scope, version);
        END IF;
    END $$;
