    -- WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    -- See the License for the specific language governing permissions and
    -- limitations under the License.

    -- Tier 1 registry of Tier 2 capabilities. Each capability's SQL file registers
    -- itself here when it is loaded (04_capabilities.sh). An application can only
    -- be installed when every capability it declares is enabled.
    CREATE TABLE IF NOT EXISTS core.capabilities (
        cap_id TEXT PRIMARY KEY CHECK (length(trim(cap_id)) > 0),
        display_name TEXT NOT NULL CHECK (length(trim(display_name)) > 0),
        category_hpdi TEXT NOT NULL CHECK (category_hpdi IN ('H', 'P', 'D', 'I')),
        base_route TEXT NOT NULL CHECK (length(trim(base_route)) > 0),
        enabled BOOLEAN NOT NULL DEFAULT true,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  03_app_registry.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors
    --
    -- Licensed under the Apache License, Version 2.0 (the "License");
    -- you may not use this file except in compliance with the License.
    -- You may obtain a copy of the License at
    --
    --     http://www.apache.org/licenses/LICENSE-2.0
    --
    -- Unless required by applicable law or agreed to in writing, software
    -- distributed under the License is distributed on an "AS IS" BASIS,
    -- WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    -- See the License for the specific language governing permissions and
    -- limitations under the License.

    -- Tier 1 application registry and access control.

    -- 1. Applications -------------------------------------------------------------
    -- One row per Tier 3 application, holding its only copy of the definition.
    -- Rows are never deleted: an uninstalled application keeps its row with status
    -- 'Removed', so files, events, audit and retained domain data still name it.
    CREATE TABLE IF NOT EXISTS core.apps (
        app_id TEXT PRIMARY KEY CHECK (app_id ~ '^[a-z][a-z0-9_]*$'),
        display_name TEXT NOT NULL CHECK (length(trim(display_name)) > 0),
        version TEXT NOT NULL CHECK (length(trim(version)) > 0),
        spec JSONB NOT NULL,
        publication_generation BIGINT NOT NULL DEFAULT 0 CHECK (publication_generation >= 0),
        status TEXT NOT NULL DEFAULT 'Pending' CHECK (status IN ('Pending', 'Applying', 'Ready', 'Failed', 'Removed')),
        last_error TEXT,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE OR REPLACE FUNCTION core.prevent_app_delete()
    RETURNS TRIGGER LANGUAGE plpgsql AS $$
    BEGIN
        RAISE EXCEPTION 'applications are uninstalled by setting status to Removed, not deleted';
    END;
    $$;

    DROP TRIGGER IF EXISTS trg_apps_no_delete ON core.apps;
    CREATE TRIGGER trg_apps_no_delete
    BEFORE DELETE ON core.apps
    FOR EACH ROW EXECUTE FUNCTION core.prevent_app_delete();

    -- Data created in 01_core_schema.sql is labelled with an application.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_files_app') THEN
            ALTER TABLE core.files ADD CONSTRAINT fk_files_app
                FOREIGN KEY (app_id) REFERENCES core.apps(app_id);
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_outbox_events_app') THEN
            ALTER TABLE core.outbox_events ADD CONSTRAINT fk_outbox_events_app
                FOREIGN KEY (app_id) REFERENCES core.apps(app_id);
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_audit_logs_app') THEN
            ALTER TABLE core.audit_logs ADD CONSTRAINT fk_audit_logs_app
                FOREIGN KEY (app_id) REFERENCES core.apps(app_id);
        END IF;
    END $$;

    -- 2. Roles ----------------------------------------------------------------------
    -- Every role is owned by the platform, one application or one capability. The
    -- operator registers application roles from manifests; a capability's SQL
    -- file registers its own roles.
    -- Names start with role_ so no role can collide with names Hasura treats as
    -- privileged (admin).
    CREATE TABLE IF NOT EXISTS core.roles (
        name TEXT PRIMARY KEY CHECK (name ~ '^role_[a-z0-9_]+$'),
        app_id TEXT REFERENCES core.apps(app_id),
        cap_id TEXT REFERENCES core.capabilities(cap_id),
        description TEXT NOT NULL DEFAULT '',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_roles_single_owner CHECK (num_nonnulls(app_id, cap_id) <= 1)
    );

    INSERT INTO core.roles (name, description) VALUES
        ('role_operator', 'Platform operations'),
        ('role_auditor', 'Read-only audit'),
        ('role_workflow', 'Workflow service account')
    ON CONFLICT (name) DO NOTHING;

    -- 3. Role assignments -------------------------------------------------------
    -- Which user holds which role. Where the role applies (own records, own
    -- department, whole organization) is declared per role by the application;
    -- departments come from cap_hr.
    CREATE TABLE IF NOT EXISTS core.user_roles (
        user_id UUID NOT NULL REFERENCES core.users(id) ON DELETE CASCADE,
        role_name TEXT NOT NULL REFERENCES core.roles(name) ON DELETE CASCADE,
        granted_by UUID REFERENCES core.users(id) ON DELETE SET NULL,
        granted_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (user_id, role_name)
    );

    CREATE INDEX IF NOT EXISTS idx_user_roles_role ON core.user_roles (role_name);

    -- Role administration. dxos-authz changes role assignments only through these
    -- functions, so its connection needs no write access to core.user_roles and
    -- every change is audited in the 'core' chain in the same transaction.
    -- p_actor is the administrator and p_acting_role the role they act as (NULL
    -- when the platform assigns the first operator).
    CREATE OR REPLACE FUNCTION core.grant_role(p_actor UUID, p_acting_role TEXT, p_user UUID, p_role TEXT)
    RETURNS BOOLEAN LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    DECLARE
        v_rows INTEGER;
    BEGIN
        IF session_user <> 'dxos_authz' THEN
            RAISE EXCEPTION 'untrusted database connection for role administration';
        END IF;
        INSERT INTO core.user_roles (user_id, role_name, granted_by)
        VALUES (p_user, p_role, p_actor)
        ON CONFLICT DO NOTHING;
        GET DIAGNOSTICS v_rows = ROW_COUNT;
        IF v_rows = 1 THEN
            INSERT INTO core.audit_logs (actor_id, acting_role, action, entity_type, entity_id, payload)
            VALUES (p_actor, p_acting_role, 'GRANT_ROLE', 'core.user_roles', p_user, jsonb_build_object('role', p_role));
        END IF;
        RETURN v_rows = 1;
    END;
    $$;

    CREATE OR REPLACE FUNCTION core.revoke_role(p_actor UUID, p_acting_role TEXT, p_user UUID, p_role TEXT)
    RETURNS BOOLEAN LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    DECLARE
        v_rows INTEGER;
    BEGIN
        IF session_user <> 'dxos_authz' THEN
            RAISE EXCEPTION 'untrusted database connection for role administration';
        END IF;
        DELETE FROM core.user_roles WHERE user_id = p_user AND role_name = p_role;
        GET DIAGNOSTICS v_rows = ROW_COUNT;
        IF v_rows = 1 THEN
            INSERT INTO core.audit_logs (actor_id, acting_role, action, entity_type, entity_id, payload)
            VALUES (p_actor, p_acting_role, 'REVOKE_ROLE', 'core.user_roles', p_user, jsonb_build_object('role', p_role));
        END IF;
        RETURN v_rows = 1;
    END;
    $$;

    -- A new installation has nobody who may assign roles. The first sign-in of the
    -- configured account makes it the platform operator, once: it is refused as
    -- soon as any user holds role_operator.
    CREATE OR REPLACE FUNCTION core.bootstrap_operator(p_user UUID)
    RETURNS BOOLEAN LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, core, public AS $$
    BEGIN
        IF session_user <> 'dxos_authz' THEN
            RAISE EXCEPTION 'untrusted database connection for role administration';
        END IF;
        PERFORM pg_advisory_xact_lock(hashtext('dxos.bootstrap_operator'));
        IF EXISTS (SELECT 1 FROM core.user_roles WHERE role_name = 'role_operator') THEN
            RETURN false;
        END IF;
        INSERT INTO core.user_roles (user_id, role_name, granted_by) VALUES (p_user, 'role_operator', p_user);
        INSERT INTO core.audit_logs (actor_id, acting_role, action, entity_type, entity_id, payload)
        VALUES (p_user, NULL, 'BOOTSTRAP_OPERATOR', 'core.user_roles', p_user, jsonb_build_object('role', 'role_operator'));
        RETURN true;
    END;
    $$;

    REVOKE ALL ON FUNCTION core.grant_role(UUID, TEXT, UUID, TEXT) FROM PUBLIC;
    REVOKE ALL ON FUNCTION core.revoke_role(UUID, TEXT, UUID, TEXT) FROM PUBLIC;
    REVOKE ALL ON FUNCTION core.bootstrap_operator(UUID) FROM PUBLIC;

    -- The workflow engine acts through one platform service account. It is not a
    -- person and has no Keycloak login: capability services admit it by the
    -- workflow service credential, and it only runs the effects that installed
    -- applications declare.
    INSERT INTO core.users (id, email, display_name)
    VALUES ('22222222-2222-4222-8222-000000000005', 'workflow@dxos.internal', 'Workflow service')
    ON CONFLICT (id) DO NOTHING;
    INSERT INTO core.user_roles (user_id, role_name)
    VALUES ('22222222-2222-4222-8222-000000000005', 'role_workflow')
    ON CONFLICT DO NOTHING;

    -- The knowledge services authenticate with Keycloak client credentials. Their
    -- fixed service-account subjects must exist as ACTIVE identities; they hold no
    -- business roles and act only through the internal service listeners.
    INSERT INTO core.users (id, email, display_name) VALUES
        ('33333333-3333-4333-8333-000000000001', 'rag-worker@dxos.internal', 'RAG worker service'),
        ('33333333-3333-4333-8333-000000000002', 'file-service@dxos.internal', 'File service delegation'),
        ('33333333-3333-4333-8333-000000000003', 'rag-dispatcher@dxos.internal', 'RAG package dispatcher')
    ON CONFLICT (id) DO NOTHING;
  04_capabilities.sh: |
    #!/bin/sh
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2026 DX-OS Open-Core Contributors
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    set -e

    CAP_DIR="/docker-entrypoint-initdb.d/capabilities"
    if [ ! -d "$CAP_DIR" ]; then
        CAP_DIR="$(cd "$(dirname "$0")/../capabilities" && pwd)"
    fi

    ENABLED="${ENABLED_CAPABILITIES:-cap-process}"

    echo "[dxos-init] Applying pluggable capabilities from: $CAP_DIR (Filter: $ENABLED)"
    for sql_file in "$CAP_DIR"/*.sql; do
        if [ -f "$sql_file" ]; then
            filename=$(basename "$sql_file" .sql)
            cap_id=$(echo "$filename" | tr '_' '-')

            if [ "$ENABLED" = "all" ] || echo ",$ENABLED," | grep -q ",$cap_id,"; then
                echo "[dxos-init] Enabling capability: $cap_id ($sql_file)"
                psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-dxos_admin}" --dbname "${POSTGRES_DB:-dxos_db}" -f "$sql_file"
            else
                echo "[dxos-init] Skipping capability (disabled): $cap_id"
            fi
        fi
    done

    # The AI overlay runs Alembic after the Core bootstrap.
  05_operator_deployments.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors
    --
    -- Licensed under the Apache License, Version 2.0 (the "License");
    -- you may not use this file except in compliance with the License.
    -- You may obtain a copy of the License at
    --
    --     http://www.apache.org/licenses/LICENSE-2.0
    --
    -- Unless required by applicable law or agreed to in writing, software
    -- distributed under the License is distributed on an "AS IS" BASIS,
    -- WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    -- See the License for the specific language governing permissions and
    -- limitations under the License.

    -- History of operator deployment attempts. A failed attempt never replaces the
    -- running definition in core.apps.
    CREATE TABLE IF NOT EXISTS core.app_deployments (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        app_id TEXT NOT NULL REFERENCES core.apps(app_id),
        version TEXT NOT NULL CHECK (length(trim(version)) > 0),
        status TEXT NOT NULL CHECK (status IN ('Applying', 'Ready', 'Failed')),
        last_error TEXT,
        started_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        completed_at TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_app_deployments_app
        ON core.app_deployments (app_id, started_at DESC);

    -- Workflows of installed applications that the operator has deployed to the
    -- workflow engine. The row is the route of the application's events: the
    -- event publisher delivers an event only to a flow recorded here, and the
    -- operator redeploys the stored definition when the engine's copy is missing
    -- or differs (revision is the engine's revision of the deployed flow).
    CREATE TABLE IF NOT EXISTS core.app_workflows (
        app_id TEXT NOT NULL REFERENCES core.apps(app_id),
        workflow_id TEXT NOT NULL CHECK (workflow_id ~ '^[a-z][a-z0-9_]*$'),
        namespace TEXT NOT NULL CHECK (namespace ~ '^[a-z][a-z0-9_.]*$'),
        flow_id TEXT NOT NULL CHECK (flow_id ~ '^[a-z][a-z0-9_]*$'),
        definition TEXT NOT NULL CHECK (length(trim(definition)) > 0),
        revision INTEGER NOT NULL CHECK (revision > 0),
        deployed_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (app_id, workflow_id),
        UNIQUE (namespace, flow_id)
    );

    -- Versions of the Tier 1 schema applied to this database, so a running
    -- installation can be upgraded in place. Written by the migration runner; the
    -- checksum detects a migration edited after it was applied.
    CREATE TABLE IF NOT EXISTS core.schema_migrations (
        version TEXT PRIMARY KEY CHECK (length(trim(version)) > 0),
        checksum TEXT NOT NULL CHECK (length(trim(checksum)) = 64),
        applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  06_runtime_roles.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors
    -- Connection identities are server authority, never business role membership.
    DO $$
    DECLARE name text;
    BEGIN
      FOREACH name IN ARRAY ARRAY['dxos_process','dxos_hasura','dxos_authz','dxos_hr','dxos_reader','dxos_caller','dxos_module_test','dxos_ai_api','dxos_ai_worker','dxos_ai_dispatcher'] LOOP
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname=name) THEN
          EXECUTE format('CREATE ROLE %I LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',name);
        END IF;
        EXECUTE format('ALTER ROLE %I NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',name);
      END LOOP;
    END $$;
    -- Bound request-serving work. Background ingestion, the knowledge dispatcher,
    -- the model gateway and Kestra legitimately run longer operations and keep no
    -- limit. New settings apply when a service opens a new connection.
    DO $$
    DECLARE r text;
    BEGIN
      FOREACH r IN ARRAY ARRAY['dxos_hasura','dxos_process','dxos_authz','dxos_hr','dxos_ai_api'] LOOP
        IF EXISTS (SELECT FROM pg_roles WHERE rolname=r) THEN
          EXECUTE format('ALTER ROLE %I SET statement_timeout = %L', r, '10s');
          IF r <> 'dxos_ai_api' THEN
            EXECUTE format('ALTER ROLE %I SET idle_in_transaction_session_timeout = %L', r, '30s');
          END IF;
        END IF;
      END LOOP;
    END $$;
    ALTER ROLE dxos_module_test CREATEDB;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE ON SCHEMA core, domain TO dxos_process, dxos_hasura, dxos_reader, dxos_caller;
    GRANT SELECT ON ALL TABLES IN SCHEMA core TO dxos_process, dxos_reader;
    GRANT INSERT, UPDATE ON core.outbox_events TO dxos_process;
    GRANT INSERT ON core.files TO dxos_process;
    GRANT UPDATE(scan_status,scan_attempt_count,scan_next_attempt_at,scanned_at) ON core.files TO dxos_process;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA core TO dxos_process;
    -- dxos-authz (ADR 0007) reads the registry and role grants, and mirrors
    -- Keycloak identities: it writes only the identity columns of core.users.
    GRANT USAGE ON SCHEMA core TO dxos_authz;
    GRANT SELECT ON core.roles, core.user_roles, core.apps, core.capabilities TO dxos_authz;
    GRANT SELECT, INSERT ON core.users TO dxos_authz;
    GRANT UPDATE (email, display_name) ON core.users TO dxos_authz;
    -- Role assignments change only through audited functions (03_app_registry.sql).
    GRANT EXECUTE ON FUNCTION core.grant_role(UUID, TEXT, UUID, TEXT) TO dxos_authz;
    GRANT EXECUTE ON FUNCTION core.revoke_role(UUID, TEXT, UUID, TEXT) TO dxos_authz;
    GRANT EXECUTE ON FUNCTION core.bootstrap_operator(UUID) TO dxos_authz;
    -- Capability schemas exist only when the capability is enabled (04_capabilities.sh).
    -- cap-process writes its own records and the work items its workflows create;
    -- HR and device master data are managed by administrators.
    DO $$
    DECLARE
        s TEXT;
    BEGIN
        FOREACH s IN ARRAY ARRAY['cap_hr', 'cap_work', 'cap_process', 'cap_data'] LOOP
            IF to_regnamespace(s) IS NOT NULL THEN
                EXECUTE format('GRANT USAGE ON SCHEMA %I TO dxos_process, dxos_reader', s);
                EXECUTE format('GRANT SELECT ON ALL TABLES IN SCHEMA %I TO dxos_process, dxos_reader', s);
            END IF;
        END LOOP;
        FOREACH s IN ARRAY ARRAY['cap_work', 'cap_process'] LOOP
            IF to_regnamespace(s) IS NOT NULL THEN
                EXECUTE format('GRANT INSERT, UPDATE ON ALL TABLES IN SCHEMA %I TO dxos_process', s);
            END IF;
        END LOOP;
    END $$;
    -- cap-hr reads the organization and, like every capability service, the
    -- registry and role grants that decide what a caller may act as. It changes
    -- departments and staff only through audited functions (cap_hr.sql).
    GRANT USAGE ON SCHEMA core TO dxos_hr;
    GRANT SELECT ON core.users, core.roles, core.user_roles, core.apps, core.capabilities TO dxos_hr;
    DO $$
    BEGIN
        IF to_regnamespace('cap_hr') IS NOT NULL THEN
            GRANT USAGE ON SCHEMA cap_hr TO dxos_hr;
            GRANT SELECT ON cap_hr.org_units, cap_hr.staff TO dxos_hr;
            GRANT EXECUTE ON FUNCTION cap_hr.create_org_unit(UUID, TEXT, TEXT, TEXT, UUID) TO dxos_hr;
            GRANT EXECUTE ON FUNCTION cap_hr.update_org_unit(UUID, TEXT, UUID, TEXT, TEXT, UUID) TO dxos_hr;
            GRANT EXECUTE ON FUNCTION cap_hr.assign_staff(UUID, TEXT, UUID, UUID, TEXT) TO dxos_hr;
            GRANT EXECUTE ON FUNCTION cap_hr.remove_staff(UUID, TEXT, UUID) TO dxos_hr;
        END IF;
    END $$;
    -- Hasura metadata is private to its connection, not exposed to business roles.
    CREATE SCHEMA IF NOT EXISTS hdb_catalog AUTHORIZATION dxos_hasura;
    CREATE SCHEMA IF NOT EXISTS hdb_views AUTHORIZATION dxos_hasura;
    -- Task 4 adds reviewed domain/source grants, not blanket future-table grants.
    -- The domain audit trigger function is defined once, in 01_core_schema.sql.
  07_app_definitions.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright 2026 DX-OS Open-Core Contributors
    --
    -- Licensed under the Apache License, Version 2.0 (the "License");
    -- you may not use this file except in compliance with the License.
    -- You may obtain a copy of the License at
    --
    --     http://www.apache.org/licenses/LICENSE-2.0
    --
    -- Unless required by applicable law or agreed to in writing, software
    -- distributed under the License is distributed on an "AS IS" BASIS,
    -- WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    -- See the License for the specific language governing permissions and
    -- limitations under the License.

    -- Which Tier 2 capabilities each application uses (many-to-many). Runs after
    -- 04_capabilities.sh so capabilities are registered. An application can only
    -- declare an enabled capability, and a capability cannot be disabled while an
    -- installed application still uses it.
    CREATE TABLE IF NOT EXISTS core.app_capabilities (
        app_id TEXT NOT NULL REFERENCES core.apps(app_id),
        cap_id TEXT NOT NULL REFERENCES core.capabilities(cap_id),
        PRIMARY KEY (app_id, cap_id)
    );

    CREATE INDEX IF NOT EXISTS idx_app_capabilities_cap ON core.app_capabilities (cap_id);

    CREATE OR REPLACE FUNCTION core.require_enabled_capability()
    RETURNS TRIGGER LANGUAGE plpgsql AS $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM core.capabilities WHERE cap_id = NEW.cap_id AND enabled) THEN
            RAISE EXCEPTION 'application % requires capability %, which is not enabled', NEW.app_id, NEW.cap_id;
        END IF;
        RETURN NEW;
    END;
    $$;

    DROP TRIGGER IF EXISTS trg_app_capabilities_enabled ON core.app_capabilities;
    CREATE TRIGGER trg_app_capabilities_enabled
    BEFORE INSERT OR UPDATE ON core.app_capabilities
    FOR EACH ROW EXECUTE FUNCTION core.require_enabled_capability();

    CREATE OR REPLACE FUNCTION core.prevent_disabling_used_capability()
    RETURNS TRIGGER LANGUAGE plpgsql AS $$
    DECLARE
        v_apps TEXT;
    BEGIN
        IF OLD.enabled AND NOT NEW.enabled THEN
            SELECT string_agg(ac.app_id, ', ' ORDER BY ac.app_id) INTO v_apps
              FROM core.app_capabilities ac
              JOIN core.apps a ON a.app_id = ac.app_id
             WHERE ac.cap_id = NEW.cap_id AND a.status <> 'Removed';
            IF v_apps IS NOT NULL THEN
                RAISE EXCEPTION 'capability % is used by installed applications: %', NEW.cap_id, v_apps;
            END IF;
        END IF;
        RETURN NEW;
    END;
    $$;

    DROP TRIGGER IF EXISTS trg_capabilities_in_use ON core.capabilities;
    CREATE TRIGGER trg_capabilities_in_use
    BEFORE UPDATE OF enabled ON core.capabilities
    FOR EACH ROW EXECUTE FUNCTION core.prevent_disabling_used_capability();

    -- 06_runtime_roles.sql runs before this file, so its schema-wide grants do not
    -- cover the table created here.
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dxos_process')
           AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dxos_reader') THEN
            GRANT SELECT ON core.app_capabilities TO dxos_process, dxos_reader;
        END IF;
    END $$;
  08_runtime_passwords.sh: |
    #!/bin/sh
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2026 DX-OS Open-Core Contributors
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    # Gives the runtime connection roles created in 06_runtime_roles.sql their login
    # passwords, and creates the Kestra role and database. Passwords come from the
    # environment (.env under Docker Compose, a Secret under Kubernetes). A role
    # whose variable is unset keeps no password and cannot log in over TCP.
    set -e

    psql_admin() {
        psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-dxos_admin}" "$@"
    }

    set_password() {
        role="$1"
        password="$2"
        if [ -z "$password" ]; then
            echo "[dxos-init] No password for $role; it cannot log in over TCP"
            return 0
        fi
        psql_admin --dbname "${POSTGRES_DB:-dxos_db}" -v role="$role" -v pw="$password" <<'SQL'
    ALTER ROLE :"role" PASSWORD :'pw';
    SQL
        echo "[dxos-init] Password set for $role"
    }

    set_password dxos_hasura "${HASURA_DATABASE_PASSWORD:-}"
    set_password dxos_process "${PROCESS_DATABASE_PASSWORD:-}"
    set_password dxos_authz "${AUTHZ_DATABASE_PASSWORD:-}"
    set_password dxos_ai_api "${AI_DATABASE_PASSWORD:-}"
    set_password dxos_ai_worker "${AI_WORKER_DATABASE_PASSWORD:-}"
    set_password dxos_ai_dispatcher "${AI_DISPATCHER_DATABASE_PASSWORD:-}"
    set_password dxos_hr "${HR_DATABASE_PASSWORD:-}"

    # Kestra keeps its repository and queue in a database of its own, owned by a
    # role with no rights in the platform database.
    if [ -n "${KESTRA_DATABASE_PASSWORD:-}" ]; then
        psql_admin --dbname postgres -v pw="$KESTRA_DATABASE_PASSWORD" <<'SQL'
    SELECT 'CREATE ROLE dxos_kestra LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dxos_kestra')
    \gexec
    ALTER ROLE dxos_kestra PASSWORD :'pw';
    SELECT 'CREATE DATABASE dxos_kestra OWNER dxos_kestra'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'dxos_kestra')
    \gexec
    REVOKE CONNECT ON DATABASE dxos_kestra FROM PUBLIC;
    SQL
        echo "[dxos-init] Kestra role and database ready"
    else
        echo "[dxos-init] KESTRA_DATABASE_PASSWORD unset; Kestra database not created"
    fi
  09_core_migrations.sh: |
    #!/bin/sh
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2026 DX-OS Open-Core Contributors
    set -eu

    migration_dir="$(dirname "$0")/../migrations"
    if [ -d /docker-entrypoint-initdb.d/migrations ]; then
        migration_dir=/docker-entrypoint-initdb.d/migrations
    fi
    umask 077
    migration_script=$(mktemp)
    trap 'rm -f "$migration_script"' EXIT HUP INT TERM
    cat > "$migration_script" <<'SQL'
    BEGIN;
    SELECT pg_advisory_xact_lock(782634901);
    \i :migration_dir/ledger.sql
    SQL

    for file in "$migration_dir"/core/[0-9][0-9][0-9][0-9]_*.sql; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        version=${filename%%_*}
        checksum=$(sha256sum "$file" | cut -d ' ' -f1)
        cat >> "$migration_script" <<SQL
    SELECT EXISTS(SELECT FROM core.schema_migrations WHERE scope='core' AND version='$version' AND checksum<>'$checksum') AS conflict \\gset
    \\if :conflict
    DO \$\$ BEGIN RAISE EXCEPTION 'Core migration checksum conflict at $version'; END \$\$;
    \\endif
    SQL
    done

    for file in "$migration_dir"/core/[0-9][0-9][0-9][0-9]_*.sql; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        version=${filename%%_*}
        checksum=$(sha256sum "$file" | cut -d ' ' -f1)
        cat >> "$migration_script" <<SQL
    SELECT NOT EXISTS(SELECT FROM core.schema_migrations WHERE scope='core' AND version='$version') AS apply_migration \\gset
    \\if :apply_migration
    \\i :migration_dir/core/$filename
    INSERT INTO core.schema_migrations(scope,version,checksum) VALUES('core','$version','$checksum');
    \\endif
    SQL
    done
    printf 'COMMIT;\n' >> "$migration_script"
    psql -X -q -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-dxos_admin}" \
        --dbname "${POSTGRES_DB:-dxos_db}" -v migration_dir="$migration_dir" -f "$migration_script"
