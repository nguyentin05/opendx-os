      PERFORM 1 FROM cap_ai.agent_conversations WHERE id = conversation AND owner_user_id = actor AND state = 'ACTIVE';
      IF NOT FOUND THEN RAISE EXCEPTION 'unavailable' USING ERRCODE = 'P0404'; END IF;
