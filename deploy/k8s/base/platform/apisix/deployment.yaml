# APISIX with the same standalone configuration as Compose. On Kubernetes the
# entry point (an Ingress in an overlay) sends /api/ and /v1/graphql to APISIX
# directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      containers:
      - name: apisix
        image: apache/apisix:3.10.0-debian
        ports:
        - containerPort: 9080
          name: http
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: config
          mountPath: /usr/local/apisix/conf/apisix.yaml
          subPath: apisix.yaml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: apisix-config
