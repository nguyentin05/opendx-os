# Generated from platform/apisix by `make k8s-config`. Do not edit:
# change the file under platform/ and regenerate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
data:
  apisix.yaml: |
    routes:
      - id: hasura-graphql
        uri: /v1/graphql
        # GraphQL subscriptions (live updates) use a WebSocket on the same path.
        enable_websocket: true
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          cors:
            allow_origins: "http://localhost:5173,http://localhost:15173"
            allow_methods: "GET,POST,PUT,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-Hasura-Role,Idempotency-Key"
          client-control:
            max_body_size: 262144
          limit-count:
            count: 600
            time_window: 60
            # Per caller token: behind the UI proxy every browser shares one address.
            # A request without Authorization falls back to the client address.
            key: http_authorization
            policy: local
            rejected_code: 429
          serverless-pre-function:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  if ngx.req.get_method() == "POST" then
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data()
                    if not body then
                      -- A body over the in-memory buffer is spooled to a file (at most 256 KiB here).
                      local path = ngx.req.get_body_file()
                      local f = path and io.open(path, "rb")
                      if f then body = f:read("*a"); f:close() end
                    end
                    if body and body:match("^%s*%[") then
                      return 400, { error = { code = "Bad Request", message = "Bad Request" } }
                    end
                  end
                end
          proxy-rewrite:
            headers:
              remove:
                - X-Hasura-Admin-Secret
                - X-Hasura-User-Id
                - X-Hasura-Workspace-Id
        upstream:
          type: roundrobin
          nodes:
            "hasura:8080": 1

      # Workflow effects are called by the workflow engine inside the network,
      # never through the gateway.
      - id: cap-process-effects-closed
        uri: /api/cap/process/effects/*
        priority: 10
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          response-rewrite:
            status_code: 404
            body: '{"error":{"code":"Not Found","message":"Not Found"}}'
            headers:
              set:
                Content-Type: application/json
        upstream:
          type: roundrobin
          nodes:
            "cap-process:8081": 1

      - id: cap-process-commands
        uri: /api/cap/process/*
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          cors:
            allow_origins: "http://localhost:5173,http://localhost:15173"
            allow_methods: "GET,POST,PUT,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-Hasura-Role,Idempotency-Key"
          proxy-rewrite:
            headers:
              remove:
                - X-Hasura-Admin-Secret
                - X-Hasura-User-Id
                - X-Hasura-Workspace-Id
        upstream:
          type: roundrobin
          nodes:
            "cap-process:8081": 1

      - id: cap-ai
        uri: /api/cap/ai/*
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          cors:
            allow_origins: "http://localhost:5173,http://localhost:15173"
            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-Hasura-Role,Idempotency-Key,If-Match"
          proxy-rewrite:
            headers:
              remove:
                - X-Hasura-Admin-Secret
                - X-Hasura-User-Id
                - X-Hasura-Workspace-Id
                - X-Hasura-Allowed-Roles
                - X-Hasura-Default-Role
                - X-Source-Delegation
        upstream:
          type: roundrobin
          retries: 0
          timeout:
            connect: 5
            send: 30
            read: 480
          nodes:
            "cap-ai:8084": 1

      # The caller's identity and the roles they hold (dxos-authz, ADR 0007).
      - id: cap-hr
        uri: /api/cap/hr/*
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          cors:
            allow_origins: "http://localhost:5173,http://localhost:15173"
            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type"
          proxy-rewrite:
            headers:
              remove:
                - X-Hasura-Admin-Secret
                - X-Hasura-User-Id
                - X-Hasura-Workspace-Id
        upstream:
          type: roundrobin
          nodes:
            "cap-hr:8083": 1

      - id: authz-me
        uri: /api/auth/*
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
          cors:
            allow_origins: "http://localhost:5173,http://localhost:15173"
            allow_methods: "GET,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type"
        upstream:
          type: roundrobin
          nodes:
            "authz:8090": 1

      - id: keycloak-oidc
        uri: /realms/*
        plugins:
          opentelemetry:
            sampler: {name: "${{OTEL_APISIX_SAMPLER:=always_off}}"}
          prometheus: {}
        upstream:
          type: roundrobin
          nodes:
            "keycloak:8085": 1

    #END
  config.yaml: |
    apisix:
      node_listen: 9080
      # Answer "Server: APISIX" without the version.
      enable_server_tokens: false
      # Docker service addresses can change after a retained-volume restart.
      dns_resolver_valid: 5
      # The control API answers inside the container only; it is not published.
      enable_control: true
      control:
        ip: "127.0.0.1"
        port: 9092

    # A plugin list replaces the image defaults, so it names every plugin the
    # routes use. opentelemetry and prometheus are opt-in telemetry (observability
    # docs): the plugin is loaded but samples nothing until a route asks for it.
    plugins:
      - cors
      - client-control
      - limit-count
      - serverless-pre-function
      - proxy-rewrite
      - response-rewrite
      - prometheus
      - opentelemetry

    plugin_attr:
      opentelemetry:
        resource:
          service.name: apisix
        collector:
          address: "${{OTEL_COLLECTOR_ADDRESS:=127.0.0.1:4318}}"
          request_timeout: 3
        batch_span_processor:
          drop_on_queue_full: true
          max_queue_size: 1024
          batch_timeout: 2
          inactive_timeout: 1
          max_export_batch_size: 16
      prometheus:
        # Scraped by the operator's Collector, never published outside the network.
        export_addr:
          ip: 0.0.0.0
          port: 9091

    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
