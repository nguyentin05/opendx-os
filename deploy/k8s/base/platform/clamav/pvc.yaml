# ClamAV: scans attachments before they can be downloaded, as in compose.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clamav-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
