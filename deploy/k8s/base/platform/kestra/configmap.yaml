# Generated from platform/kestra by `make k8s-config`. Do not edit:
# change the file under platform/ and regenerate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-config
data:
  config.yaml: |
    # OpenTelemetry is off unless the operator enables it and points the OTLP
    # endpoint at a Collector. Traces and OTLP metrics are independent switches.
    micronaut:
      otel:
        enabled: ${KESTRA_OTEL_ENABLED:false}
      metrics:
        export:
          otlp:
            enabled: ${KESTRA_OTLP_METRICS_ENABLED:false}
            url: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}/v1/metrics"

    # Kestra's OTLP trace exporter speaks gRPC only, so it takes the Collector's
    # gRPC address, not the OTLP/HTTP one the other services use.
    otel:
      traces:
        exporter: ${OTEL_TRACES_EXPORTER:otlp}
      exporter:
        otlp:
          endpoint: "${KESTRA_OTEL_ENDPOINT:http://127.0.0.1:4317}"

    datasources:
      postgres:
        url: "jdbc:postgresql://${KESTRA_DATABASE_HOST:postgres}:5432/${KESTRA_DATABASE_NAME:dxos_kestra}"
        driverClassName: org.postgresql.Driver
        username: "${KESTRA_DATABASE_USER:dxos_kestra}"
        password: "${KESTRA_DATABASE_PASSWORD}"

    kestra:
      traces:
        root: ${KESTRA_TRACES_ROOT:DISABLED}
      repository:
        type: postgres
      queue:
        type: postgres
      storage:
        type: local
        local:
          base-path: /app/storage
      server:
        basic-auth:
          enabled: true
          username: "${KESTRA_USER:admin@dxos.local}"
          password: "${KESTRA_PASSWORD:change-me-local-kestra}"
  start.sh: |
    #!/usr/bin/env bash
    # Starts Kestra with the three secrets application flows may read. Kestra
    # takes secrets from SECRET_<NAME> variables holding base64, so the plain
    # values of the platform's environment are encoded here:
    #
    #   DXOS_WEBHOOK_KEY     key of the webhook trigger the event publisher calls
    #   DXOS_PROCESS_URL     where flows reach cap-process inside the network
    #   DXOS_WORKFLOW_TOKEN  workflow service credential for the effect endpoints
    set -euo pipefail

    for name in DXOS_WEBHOOK_KEY DXOS_PROCESS_URL DXOS_WORKFLOW_TOKEN; do
        value="${!name:-}"
        if [ -z "$value" ]; then
            echo "[kestra] $name is required" >&2
            exit 1
        fi
        export "SECRET_${name}=$(printf '%s' "$value" | base64 -w0)"
        unset "$name"
    done

    exec /app/kestra server standalone --config /app/config/config.yaml
