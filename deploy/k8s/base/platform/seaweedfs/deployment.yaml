# SeaweedFS: the S3 store for attachments, as in compose.yaml. The service name
# matches Compose, so the shared configuration under platform/ resolves the host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:3.80
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        args: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
        ports:
        - containerPort: 8333
          name: s3
        readinessProbe:
          tcpSocket: {port: s3}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        # Built by deploy/k8s/apply.sh from the S3 keys in dxos-secrets.
        - name: s3-config
          mountPath: /etc/seaweedfs/s3.json
          subPath: s3.json
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: s3-config
        secret:
          secretName: seaweedfs-s3
