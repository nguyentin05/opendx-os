# SeaweedFS: the S3 store for attachments, as in compose.yaml. The service name
# matches Compose, so the shared configuration under platform/ resolves the host.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
