# dxos-authz: resolves the caller's roles on every request (Hasura webhook and
# /api/auth). Connects with its own restricted database role; tokens are
# verified against the public issuer (dxos-public) with keys fetched in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: authz
spec:
  selector:
    app: authz
  ports:
  - name: http
    port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authz
  template:
    metadata:
      labels:
        app: authz
    spec:
      containers:
      - name: authz
        image: opendx-dxos-authz
        env:
        - name: PORT
          value: "8090"
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: dxos-secrets, key: AUTHZ_DATABASE_PASSWORD}}
        - name: DATABASE_URL
          value: postgres://dxos_authz:$(DB_PASSWORD)@postgres:5432/dxos_db?sslmode=disable
        - name: OIDC_ISSUER_URL
          valueFrom: {configMapKeyRef: {name: dxos-public, key: OIDC_ISSUER_URL}}
        - name: OIDC_JWKS_URL
          value: http://keycloak:8085/realms/dxos/protocol/openid-connect/certs
        - name: OIDC_AUDIENCE
          value: dxos-runtime
        - name: ROLE_CACHE_TTL
          value: 5s
        - name: BOOTSTRAP_OPERATOR_EMAIL
          valueFrom: {configMapKeyRef: {name: dxos-public, key: BOOTSTRAP_OPERATOR_EMAIL}}
        ports:
        - containerPort: 8090
          name: http
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
