# Example overlay for Azure Kubernetes Service (AKS). Reference only: it has not
# been run on a cluster, and nothing in deploy/k8s/base depends on it. It uses the
# application routing add-on (managed NGINX), a certificate from Azure Key Vault
# and Standard SSD managed disks. Set the five values under dxos-public to your
# domain, and the Key Vault URI in ingress.yaml.
resources:
- ../../base
- storageclass.yaml
- ingress.yaml
- not-found.yaml
configMapGenerator:
- name: dxos-public
  namespace: dxos
  behavior: merge
  literals:
  - APP_HOST=app.example.com
  - AUTH_HOST=auth.example.com
  - KEYCLOAK_HOSTNAME=https://auth.example.com
  - OIDC_ISSUER_URL=https://auth.example.com/realms/dxos
  - DXOS_OIDC_ORIGIN=https://auth.example.com
replacements:
- source: {kind: ConfigMap, name: dxos-public, fieldPath: data.APP_HOST}
  targets:
  - select: {kind: Ingress, name: dxos}
    fieldPaths: [spec.tls.0.hosts.0, spec.rules.0.host]
- source: {kind: ConfigMap, name: dxos-public, fieldPath: data.AUTH_HOST}
  targets:
  - select: {kind: Ingress, name: dxos}
    fieldPaths: [spec.tls.0.hosts.1, spec.rules.1.host]
