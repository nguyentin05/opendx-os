# Reference only, not tested. The identity the add-on uses to read the TLS
# certificate from Key Vault: a user-assigned managed identity with the
# "Key Vault Secrets User" role on the vault, federated with this ServiceAccount
# through Entra Workload Identity. Set its client ID below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dxos-gateway-tls
  namespace: dxos
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  labels:
    azure.workload.identity/use: "true"
