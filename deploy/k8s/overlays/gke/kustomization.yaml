# Example overlay for Google Kubernetes Engine (GKE). Reference only: it has not
# been run on a cluster, and nothing in deploy/k8s/base depends on it. It uses
# GKE's built-in Ingress controller, a Google-managed certificate and balanced
# persistent disks. Set the five values under dxos-public to your domain.
resources:
- ../../base
- storageclass.yaml
- ingress.yaml
- managedcertificate.yaml
- frontendconfig.yaml
- backendconfig.yaml
- not-found.yaml
configMapGenerator:
- name: dxos-public
  namespace: dxos
  behavior: merge
  literals:
  - APP_HOST=app.example.com
  - AUTH_HOST=auth.example.com
  - KEYCLOAK_HOSTNAME=https://auth.example.com
  - OIDC_ISSUER_URL=https://auth.example.com/realms/dxos
  - DXOS_OIDC_ORIGIN=https://auth.example.com
# Load balancer health checks per backend (backendconfig.yaml).
patches:
- target: {kind: Service, name: apisix}
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cloud.google.com/backend-config: '{"default": "dxos-apisix"}'
- target: {kind: Service, name: keycloak}
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cloud.google.com/backend-config: '{"default": "dxos-keycloak"}'
replacements:
- source: {kind: ConfigMap, name: dxos-public, fieldPath: data.APP_HOST}
  targets:
  - select: {kind: Ingress, name: dxos}
    fieldPaths: [spec.rules.0.host]
  - select: {kind: ManagedCertificate, name: dxos}
    fieldPaths: [spec.domains.0]
- source: {kind: ConfigMap, name: dxos-public, fieldPath: data.AUTH_HOST}
  targets:
  - select: {kind: Ingress, name: dxos}
    fieldPaths: [spec.rules.1.host]
  - select: {kind: ManagedCertificate, name: dxos}
    fieldPaths: [spec.domains.1]
