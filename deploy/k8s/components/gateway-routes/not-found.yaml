# A Service that selects no pod: the routes that point here (the Keycloak
# console) fail instead of reaching Keycloak.
apiVersion: v1
kind: Service
metadata:
  name: not-found
  namespace: dxos
spec:
  selector:
    app: not-found
  ports:
  - port: 80
