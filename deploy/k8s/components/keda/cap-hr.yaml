# cap-hr only answers requests, so it runs only while it gets them: the first
# request after a quiet period waits in the interceptor until a pod is ready.
apiVersion: v1
kind: Service
metadata:
  name: cap-hr-app
  namespace: dxos
spec:
  selector:
    app: cap-hr
  ports:
  - name: http
    port: 8083
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: cap-hr
  namespace: dxos
spec:
  pathPrefixes: ["/api/cap/hr"]
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cap-hr
    service: cap-hr-app
    port: 8083
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 300
