# eksctl configuration for the demo cluster; not part of the kustomization.
#   eksctl create cluster -f deploy/overlays/eks/cluster.yaml
#   eksctl delete cluster -f deploy/overlays/eks/cluster.yaml --disable-nodegroup-eviction
# Nodes run in public subnets and the VPC has no NAT gateway, which saves its
# hourly charge; only the ALB and the nodes' security group face the internet.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: dxos-demo
  region: ap-southeast-2
  version: "1.36"
  tags:
    project: opendx-os
vpc:
  nat:
    gateway: Disable
autoModeConfig:
  enabled: false
addonsConfig:
  autoApplyPodIdentityAssociations: true
addons:
- name: vpc-cni
- name: coredns
- name: kube-proxy
- name: eks-pod-identity-agent
- name: aws-ebs-csi-driver
iam:
  podIdentityAssociations:
  - namespace: kube-system
    serviceAccountName: aws-load-balancer-controller
    createServiceAccount: true
    wellKnownPolicies:
      awsLoadBalancerController: true
managedNodeGroups:
- name: general
  instanceType: m7i-flex.large
  amiFamily: AmazonLinux2023
  desiredCapacity: 2
  minSize: 0
  maxSize: 3
  volumeSize: 30
  volumeType: gp3
  privateNetworking: false
