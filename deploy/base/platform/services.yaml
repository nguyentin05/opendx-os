# Supporting services as in compose.yaml: SeaweedFS (S3 store for attachments),
# ClamAV (attachment scanning) and Kestra (application workflows). Service names
# match the Compose service names, so the shared configuration files under
# platform/ resolve the same hosts.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
  - name: s3
    port: 8333
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:3.80
        args: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
        ports:
        - containerPort: 8333
          name: s3
        readinessProbe:
          tcpSocket: {port: s3}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        volumeMounts:
        - name: data
          mountPath: /data
        # Built by deploy/apply.sh from the S3 keys in dxos-secrets.
        - name: s3-config
          mountPath: /etc/seaweedfs/s3.json
          subPath: s3.json
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: s3-config
        secret:
          secretName: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector:
    app: clamav
  ports:
  - name: clamd
    port: 3310
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clamav-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
      - name: clamav
        image: clamav/clamav:1.4
        env:
        - name: CLAMD_CONF_StreamMaxLength
          value: 25M
        - name: CLAMD_CONF_MaxFileSize
          value: 25M
        - name: CLAMD_CONF_MaxScanSize
          value: 50M
        ports:
        - containerPort: 3310
          name: clamd
        # The first start downloads the signature database.
        startupProbe:
          exec:
            command: ["/usr/local/bin/clamdcheck.sh"]
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          exec:
            command: ["/usr/local/bin/clamdcheck.sh"]
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 1536Mi}
          limits: {memory: 3Gi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/clamav
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clamav-data
---
apiVersion: v1
kind: Service
metadata:
  name: kestra
spec:
  selector:
    app: kestra
  ports:
  - name: http
    port: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kestra-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kestra
  template:
    metadata:
      labels:
        app: kestra
    spec:
      containers:
      - name: kestra
        image: kestra/kestra:v0.20.7
        # start.sh hands the platform's secrets to Kestra, then starts the server.
        command: ["/bin/bash", "/app/config/start.sh"]
        env:
        - name: KESTRA_DATABASE_PASSWORD
          valueFrom: {secretKeyRef: {name: dxos-secrets, key: KESTRA_DATABASE_PASSWORD}}
        - name: KESTRA_USER
          valueFrom: {configMapKeyRef: {name: dxos-public, key: KESTRA_USER}}
        - name: KESTRA_PASSWORD
          valueFrom: {secretKeyRef: {name: dxos-secrets, key: KESTRA_PASSWORD}}
        - name: DXOS_WEBHOOK_KEY
          valueFrom: {secretKeyRef: {name: dxos-secrets, key: KESTRA_WEBHOOK_KEY}}
        - name: DXOS_PROCESS_URL
          value: http://cap-process:8081
        - name: DXOS_WORKFLOW_TOKEN
          valueFrom: {secretKeyRef: {name: dxos-secrets, key: WORKFLOW_SERVICE_TOKEN}}
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          tcpSocket: {port: http}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {memory: 2Gi}
        volumeMounts:
        - name: data
          mountPath: /app/storage
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kestra-data
      - name: config
        configMap:
          name: kestra-config
