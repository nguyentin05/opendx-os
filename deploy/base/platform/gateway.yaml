# APISIX with the same standalone configuration as Compose, and the Workspace UI.
# On Kubernetes the entry point (an Ingress in an overlay) sends /api/ and
# /v1/graphql to APISIX directly; the UI image's own proxy uses the Docker DNS
# address and is not used here.
apiVersion: v1
kind: Service
metadata:
  name: apisix
spec:
  selector:
    app: apisix
  ports:
  - name: http
    port: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      containers:
      - name: apisix
        image: apache/apisix:3.10.0-debian
        ports:
        - containerPort: 9080
          name: http
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: config
          mountPath: /usr/local/apisix/conf/apisix.yaml
          subPath: apisix.yaml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: apisix-config
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-ui
spec:
  selector:
    app: workspace-ui
  ports:
  - name: http
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-ui
  template:
    metadata:
      labels:
        app: workspace-ui
    spec:
      containers:
      - name: workspace-ui
        image: opendx-workspace-ui
        env:
        - name: DXOS_OIDC_ORIGIN
          valueFrom: {configMapKeyRef: {name: dxos-public, key: DXOS_OIDC_ORIGIN}}
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 128Mi}
