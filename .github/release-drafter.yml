name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) $AUTHORS"

categories:
  # Breaking changes get one section; feature PRs that break keep the
  # breaking label instead of appearing in Added as well.
  - title: "Breaking"
    exclusive: true
    semver-increment: minor
    when:
      label: breaking
  - title: "Added"
    semver-increment: minor
    when:
      label: feature
  - title: "Fixed"
    when:
      label: fix
  - title: "Security"
    when:
      label: security
  - title: "Docs"
    when:
      label: docs
  - title: "Maintenance"
    when:
      labels:
        - maintenance
        - dependencies
  # v7 resolves versions through categories instead of a top-level
  # version-resolver block. Pre-1.0 breaking changes bump the minor version.
  - type: version-resolver
    semver-increment: minor
    when:
      label: breaking
  - type: version-resolver
    semver-increment: minor
    when:
      label: feature
  - type: version-resolver
    semver-increment: patch

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - labels: [feature]
    title:
      - '/^feat(\([^)]*\))?!?:/'
  - labels: [fix]
    title:
      - '/^fix(\([^)]*\))?!?:/'
  - labels: [docs]
    title:
      - '/^docs(\([^)]*\))?!?:/'
  - labels: [maintenance]
    title:
      - '/^(ci|build|chore|refactor|style|test|perf)(\([^)]*\))?!?:/'
  - labels: [breaking]
    title:
      - '/^[a-z]+(\([^)]*\))?!:/'
  - labels: [security]
    title:
      - '/security/i'
