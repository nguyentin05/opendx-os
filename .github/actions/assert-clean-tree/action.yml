name: Assert clean working tree
description: Fail when a test suite modified tracked or untracked repository files

runs:
  using: composite
  steps:
    - name: Check git status
      shell: bash
      # Composite steps do not inherit the job's defaults.run.working-directory.
      working-directory: ${{ github.workspace }}
      run: |
        set -uo pipefail
        dirty="$(git status --porcelain)"
        if [ -n "${dirty}" ]; then
          echo "::error::a suite modified the working tree"
          printf '%s\n' "${dirty}"
          git diff
          exit 1
        fi
