name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.en.yml"
      - ".vale.ini"
      - "requirements-docs.txt"
      - "tests/test_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.en.yml"
      - ".vale.ini"
      - "requirements-docs.txt"
      - "tests/test_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-docs:
    name: Check MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install MkDocs Material & Extensions
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs Site
        run: mkdocs build --strict

      - name: Run Docs Tests
        run: python3 -m unittest tests.test_docs -v

      - name: Lint Prose with Vale
        uses: errata-ai/vale-action@v3.0.0
        with:
          version: 3.27.0
          files: docs
          fail_on_error: true
          filter_mode: nofilter

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy-docs:
    name: Deploy MkDocs Site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
