name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run repository hygiene checks
        run: make check-hygiene

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run tier boundary checks
        run: make check-architecture

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  backend:
    name: backend (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile="${RUNNER_TEMP}/coverage.out" ./...

      - name: Summarize coverage
        if: always()
        run: |
          [ -f "${RUNNER_TEMP}/coverage.out" ] || exit 0
          {
            echo "### Go coverage (${{ matrix.module }})"
            echo
            echo "Total: $(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ {print $NF}') of statements"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Run contract, hygiene, and docs tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-${{ github.run_id }}@localhost:5432/postgres_test?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: postgres_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            operator/go.sum
            capabilities/go.sum

      - name: Provision cluster roles and platform schemas
        run: scripts/ci/provision-test-db.sh

      - name: SQL contract assertions on a fresh database
        run: |
          psql -v ON_ERROR_STOP=1 "${TEST_DATABASE_URL/postgres_test/postgres}" -c "CREATE DATABASE contract_test"
          TEST_DATABASE_URL="${TEST_DATABASE_URL/postgres_test/contract_test}" scripts/test-platform.sh

      - name: Integration tests (first run)
        run: |
          (cd operator && go test -tags=integration -p 1 -count=1 ./...)
          (cd capabilities && go test -tags=integration -p 1 -count=1 ./...)
      - name: Integration tests (second run against the same server)
        run: |
          (cd operator && go test -tags=integration -p 1 -count=1 ./...)
          (cd capabilities && go test -tags=integration -p 1 -count=1 ./...)

      - name: The suites must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  ai:
    name: ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Python tooling and Tesseract
        run: |
          python3 -m pip install uv==0.13.3
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Python AI acceptance smoke
        run: make test-ai

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree
