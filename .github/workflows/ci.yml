name: CI

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run repository hygiene checks
        run: make check-hygiene

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run tier boundary checks
        run: make check-architecture

  lint:
    name: Lint Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  backend:
    name: Backend Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile="${RUNNER_TEMP}/coverage.out" ./...

      - name: Summarize coverage
        if: always()
        run: |
          [ -f "${RUNNER_TEMP}/coverage.out" ] || exit 0
          {
            echo "### Go coverage (${{ matrix.module }})"
            echo
            echo "Total: $(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ {print $NF}') of statements"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Run contract, hygiene, and docs tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-ui
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-${{ github.run_id }}@localhost:5432/postgres_test?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: postgres_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            operator/go.sum
            capabilities/go.sum

      - name: Provision cluster roles and platform schemas
        run: scripts/ci/provision-test-db.sh

      - name: Integration tests (first run)
        run: |
          (cd operator && go test -tags=integration -p 1 -count=1 ./...)
          (cd capabilities && go test -tags=integration -p 1 -count=1 ./...)
      - name: Integration tests (second run against the same server)
        run: |
          (cd operator && go test -tags=integration -p 1 -count=1 ./...)
          (cd capabilities && go test -tags=integration -p 1 -count=1 ./...)

      - name: The suites must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree

  parser:
    name: parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The parser runs on Alpine in production. GitHub's JavaScript actions need
      # glibc and cannot run inside an Alpine job container, so the tests execute
      # through docker against the same image and pinned poppler-utils version.
      - name: Parser tests must actually run the PDF checks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src -e GOTOOLCHAIN=local \
            golang:1.27.3-alpine3.23 sh -c '
              set -e
              apk add --no-cache poppler-utils=25.12.0-r0 git >/dev/null
              cd capabilities
              if ! go test -count=1 -v ./internal/knowledge/docir/... > /tmp/docir.log 2>&1; then
                cat /tmp/docir.log
                exit 1
              fi
              cat /tmp/docir.log
              if grep -q -- "--- SKIP" /tmp/docir.log; then
                echo "FAIL: PDF parser checks were skipped; poppler-utils is missing."
                grep -- "--- SKIP" /tmp/docir.log
                exit 1
              fi
            '

      - name: The suite must not modify the working tree
        if: always()
        uses: ./.github/actions/assert-clean-tree
