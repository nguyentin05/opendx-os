name: Release Gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/release/**"
      - "scripts/package_release.sh"
      - "scripts/install.sh"
      - "docs/contribute/releasing.md"
      - ".github/workflows/release*.yml"
  pull_request:
    paths:
      - "scripts/release/**"
      - "scripts/package_release.sh"
      - "scripts/install.sh"
      - "docs/contribute/releasing.md"
      - ".github/workflows/release*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-gate:
    name: archive gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prove the gate fails: this rejects archives the package step must never emit.
      - name: The gate must reject forbidden and incomplete archives
        run: scripts/release/test-verify-archive.sh

      - name: Package the tree
        run: scripts/package_release.sh 0.0.0-gate

      - name: The packaged archive must pass the gate
        run: scripts/release/verify-archive.sh dist/dxos-open-core-0.0.0-gate.tar.gz

      - name: The checksum must match the archive
        working-directory: dist
        run: sha256sum -c dxos-open-core-0.0.0-gate.tar.gz.sha256

      # Inspect the artifact the release would ship, not the source tree.
      - name: The extracted tree must be installable
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/dxos-open-core-0.0.0-gate.tar.gz -C "${tmp}"
          root="${tmp}/dxos-open-core-0.0.0-gate"
          test -x "${root}/scripts/install.sh" || { echo "scripts/install.sh is not executable"; exit 1; }
          bash -n "${root}/scripts/install.sh"
          bash -n "${root}/scripts/package_release.sh"
          echo "packaged tree inspected: ${root}"
