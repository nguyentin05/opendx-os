name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Mondays 03:43 UTC, after the security scans.
    - cron: "43 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            operator/go.sum
            capabilities/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd operator && go build ./...)
          (cd capabilities && go build ./...)
      - name: Analyze
        uses: github/codeql-action/analyze@v4 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
