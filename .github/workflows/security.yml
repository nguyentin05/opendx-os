name: Security

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (${{ matrix.scan }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        scan: [fs, config]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: ${{ matrix.scan }}
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.scan }}.sarif
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-${{ matrix.scan }}.sarif
          category: trivy-${{ matrix.scan }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run govulncheck
        continue-on-error: true
        uses: golang/govulncheck-action@v1.1.0
        with:
          check-latest: false
          cache-dependency-path: ${{ matrix.module }}/go.sum
          go-package: ./...
          work-dir: ${{ matrix.module }}
          repo-checkout: false
          go-version-file: ${{ matrix.module }}/go.mod
