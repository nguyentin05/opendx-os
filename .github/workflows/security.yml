name: Security

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - 'docs/**'
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (${{ matrix.scan }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        scan: [fs, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The YAML form scopes each accepted finding to named files.
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: ${{ matrix.scan }}
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.scan }}.sarif
          exit-code: '1'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.scan }}.sarif
          category: trivy-${{ matrix.scan }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [operator, capabilities]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        # shortcut: report-only while the modules stay on Go 1.27.3, whose
        # net/http carries GO-2026-6859 (fixed in Go 1.27.4); remove this after
        # the Go upgrade (#86). Every other finding is fixed.
        continue-on-error: true
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          check-latest: false
          cache-dependency-path: ${{ matrix.module }}/go.sum
          go-package: ./...
          work-dir: ${{ matrix.module }}
          repo-checkout: false
          go-version-file: ${{ matrix.module }}/go.mod
