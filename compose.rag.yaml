# Fresh installation: docker compose -f compose.yaml -f compose.rag.yaml up --build
# AI migrations run in ai-migrate after PostgreSQL initialization.
x-ai-image: &ai-image
  image: dxos-ai:dev

x-subjects: &subjects
  RAG_WORKER_SERVICE_SUBJECT: ${RAG_WORKER_SERVICE_SUBJECT:?set the worker OIDC subject}
  RAG_FILE_SERVICE_SUBJECT: ${RAG_FILE_SERVICE_SUBJECT:?set the File Service OIDC subject}

services:
  postgres:
    image: dxos-ai-postgres:dev
    build:
      context: ./platform/postgres/ai
      additional_contexts:
        legal: .
    environment:
      AI_BROKER_DATABASE_PASSWORD: ${AI_BROKER_DATABASE_PASSWORD:?set the broker password}
      ENABLED_CAPABILITIES: ${ENABLED_CAPABILITIES:-cap-process,cap-hr,cap-work,cap-data,cap-ai}
      AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:?set the API database password}
      AI_WORKER_DATABASE_PASSWORD: ${AI_WORKER_DATABASE_PASSWORD:?set the worker database password}
      AI_DISPATCHER_DATABASE_PASSWORD: ${AI_DISPATCHER_DATABASE_PASSWORD:?set the dispatcher database password}

    volumes:
      - ./platform/postgres/ai/bootstrap.sh:/docker-entrypoint-initdb.d/10_ai_extensions.sh:ro

  operator:
    environment:
      RAG_PACKAGE_ARTIFACT_ROOT: /var/lib/dxos/package-artifacts
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-clamav:3310}
    volumes:
      - package-artifacts:/var/lib/dxos/package-artifacts

  cap-process:
    environment:
      <<: *subjects
      RAG_PRIVATE_UPLOAD_ENABLED: ${RAG_PRIVATE_UPLOAD_ENABLED:-true}
      RAG_INTERNAL_LISTEN: ":8181"
      RAG_INTERNAL_AI_URL: http://cap-ai:8084
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/token}
      RAG_FILE_CLIENT_ID: ${RAG_FILE_CLIENT_ID:-dxos-file-service}
      RAG_FILE_CLIENT_SECRET: ${RAG_FILE_CLIENT_SECRET:-}
      RAG_INTERNAL_BEARER_TOKEN: ${RAG_INTERNAL_BEARER_TOKEN:-${RAG_FILE_BEARER_TOKEN:-}}

  ai-migrate:
    <<: *ai-image
    command: ["alembic", "upgrade", "head"]
    environment:
      AI_MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-dxos_admin}:${POSTGRES_PASSWORD:-dxos_secret}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  cap-ai:
    <<: *ai-image
    build:
      context: ./capabilities/ai
      additional_contexts:
        legal: .
    restart: unless-stopped
    environment:
      <<: *subjects
      DATABASE_URL: postgres://dxos_ai_api:${AI_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      AI_MODEL_MASTER_KEY: &model-key ${AI_MODEL_MASTER_KEY:-}
      AI_HOSTED_MODEL_ENDPOINTS: &hosted-endpoints ${AI_HOSTED_MODEL_ENDPOINTS:-[]}
      AI_LOCAL_MODEL_ENDPOINTS: &local-endpoints ${AI_LOCAL_MODEL_ENDPOINTS:-{}}
      AI_BROKER_URL: &broker-db pgmq://dxos_ai_broker:${AI_BROKER_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-dxos_db}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dxos-runtime}
      RAG_DISPATCHER_SERVICE_SUBJECT: ${RAG_DISPATCHER_SERVICE_SUBJECT:?set the dispatcher OIDC subject}
      RAG_PACKAGE_ARTIFACT_ROOT: /var/lib/dxos/package-artifacts
    volumes:
      - type: volume
        source: package-artifacts
        target: /var/lib/dxos/package-artifacts
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8084/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      ai-migrate:
        condition: service_completed_successfully

  cap-ai-worker:
    <<: *ai-image
    command: ["celery", "-A", "dxos_ai.worker", "worker", "--loglevel=INFO", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dxos_ai_worker:${AI_WORKER_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      AI_BROKER_URL: *broker-db
      AI_MODEL_MASTER_KEY: *model-key
      AI_HOSTED_MODEL_ENDPOINTS: *hosted-endpoints
      AI_LOCAL_MODEL_ENDPOINTS: *local-endpoints
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/token}
      RAG_WORKER_CLIENT_ID: ${RAG_WORKER_CLIENT_ID:-dxos-rag-worker}
      RAG_WORKER_CLIENT_SECRET: ${RAG_WORKER_CLIENT_SECRET:-}
      RAG_WORKER_BEARER_TOKEN: ${RAG_WORKER_BEARER_TOKEN:-}
      RAG_INTERNAL_FILE_URL: http://cap-process:8181
      RAG_PACKAGE_ARTIFACT_ROOT: /var/lib/dxos/package-artifacts
    volumes:
      - type: volume
        source: package-artifacts
        target: /var/lib/dxos/package-artifacts
        read_only: true
        volume:
          nocopy: true
    depends_on:
      ai-migrate:
        condition: service_completed_successfully

  knowledge-dispatcher:
    build:
      context: ./operator
      additional_contexts:
        legal: .
    entrypoint: ["/usr/local/bin/dxos-knowledge-dispatcher"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dxos_ai_dispatcher:${AI_DISPATCHER_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      RAG_INTERNAL_AI_URL: http://cap-ai:8084
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/token}
      RAG_DISPATCHER_CLIENT_ID: ${RAG_DISPATCHER_CLIENT_ID:-dxos-rag-dispatcher}
      RAG_DISPATCHER_CLIENT_SECRET: ${RAG_DISPATCHER_CLIENT_SECRET:-}
      RAG_DISPATCHER_BEARER_TOKEN: ${RAG_DISPATCHER_BEARER_TOKEN:-}
    depends_on:
      - cap-ai

volumes:
  package-artifacts:
