routes:
  - id: hasura-graphql
    uri: /v1/graphql
    plugins:
      cors:
        allow_origins: "http://localhost:5173,http://localhost:15173"
        allow_methods: "GET,POST,PUT,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Hasura-Role,Idempotency-Key"
      proxy-rewrite:
        headers:
          remove:
            - X-Hasura-Admin-Secret
            - X-Hasura-User-Id
            - X-Hasura-Workspace-Id
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  - id: cap-process-commands
    uri: /api/cap/process/*
    plugins:
      cors:
        allow_origins: "http://localhost:5173,http://localhost:15173"
        allow_methods: "GET,POST,PUT,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Hasura-Role,Idempotency-Key"
      proxy-rewrite:
        headers:
          remove:
            - X-Hasura-Admin-Secret
            - X-Hasura-User-Id
            - X-Hasura-Workspace-Id
    upstream:
      type: roundrobin
      nodes:
        "cap-process:8081": 1

  # The caller's identity and the roles they hold (dxos-authz, ADR 0007).
  - id: authz-me
    uri: /api/auth/*
    plugins:
      cors:
        allow_origins: "http://localhost:5173,http://localhost:15173"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization,Content-Type"
    upstream:
      type: roundrobin
      nodes:
        "authz:8090": 1

  - id: keycloak-oidc
    uri: /realms/*
    upstream:
      type: roundrobin
      nodes:
        "keycloak:8085": 1

#END
