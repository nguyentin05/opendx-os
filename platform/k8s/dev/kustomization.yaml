# Disposable development platform for the operator on a local cluster (kind).
# Runs PostgreSQL and Hasura only; scripts/k8s/dev-cluster.sh creates the
# credentials Secret and the init-SQL ConfigMaps from platform/postgres/ first.
namespace: dxos-platform
resources:
- namespace.yaml
- postgres.yaml
- hasura.yaml
