# PostgreSQL 17 initialized from platform/postgres/init (ConfigMap postgres-init)
# and the capability modules (ConfigMap postgres-capabilities). Data lives in an
# emptyDir: this deployment is disposable and must not hold real data.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: dxos_admin
        - name: POSTGRES_DB
          value: dxos_db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dxos-platform-credentials
              key: postgres-password
        - name: HASURA_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dxos-platform-credentials
              key: hasura-db-password
        - name: ENABLED_CAPABILITIES
          value: cap-process,cap-hr,cap-work
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "dxos_admin", "-d", "dxos_db"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: initdb
        projected:
          sources:
          - configMap:
              name: postgres-init
          - configMap:
              name: postgres-capabilities
              items:
              - key: cap_hr.sql
                path: capabilities/cap_hr.sql
              - key: cap_work.sql
                path: capabilities/cap_work.sql
              - key: cap_process.sql
                path: capabilities/cap_process.sql
              - key: cap_data.sql
                path: capabilities/cap_data.sql
              - key: cap_ai.sql
                path: capabilities/cap_ai.sql
      - name: data
        emptyDir: {}
