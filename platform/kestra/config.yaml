datasources:
  postgres:
    url: "jdbc:postgresql://${KESTRA_DATABASE_HOST:postgres}:5432/${KESTRA_DATABASE_NAME:dxos_kestra}"
    driverClassName: org.postgresql.Driver
    username: "${KESTRA_DATABASE_USER:dxos_kestra}"
    password: "${KESTRA_DATABASE_PASSWORD}"

kestra:
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  server:
    basic-auth:
      enabled: true
      username: "${KESTRA_USER:admin@dxos.local}"
      password: "${KESTRA_PASSWORD:change-me-local-kestra}"
