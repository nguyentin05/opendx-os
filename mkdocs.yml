      - Anti-patterns: architecture/anti-patterns.md
      - RAG authorization (proposed): architecture/rag-authorization-proposal.md
  - Decisions:
      - ADR index: adr/index.md
      - ADR 0001: adr/0001-three-tier-composable-architecture.md
      - ADR 0002: adr/0002-semantic-schema-governance-and-cross-app-data-sync.md
      - ADR 0003: adr/0003-modular-capability-schema-separation-for-iot-data.md
      - ADR 0004: adr/0004-kubernetes-crd-operator.md
      - ADR 0005: adr/0005-department-and-application-data-model.md
      - ADR 0006: adr/0006-where-application-business-logic-lives.md
      - ADR 0007: adr/0007-keycloak-authenticates-platform-authorizes.md
      - ADR 0008: adr/0008-an-application-declares-several-tables.md
      - ADR 0009: adr/0009-native-rag-identity-and-source-boundaries.md
  - Operate:
      - Installation: operations/installation.md
      - Runbook: operations/runbook.md
  - Contribute:
      - Overview: contribute/index.md
      - Verification: contribute/verification.md
      - Source hygiene: contribute/source-hygiene.md
      - Releasing: contribute/releasing.md
      - Writing docs: contribute/writing-docs.md
  - Legacy (migrating):
      - Data contracts: contracts/data-contracts.md
      - Security and acceptance: contracts/security-and-acceptance.md
      - RAG API (proposed): contracts/rag-api.proposed.md
      - Adding an application: development/adding-an-app.md
      - Integrating the UI: development/ui-integration.md
      - Package knowledge: development/package-knowledge.md
      - Personal library: development/personal-library.md
      - Model knowledge: development/model-knowledge.md
      - Verification: development/verification.md
      - Source hygiene: development/source-hygiene.md
