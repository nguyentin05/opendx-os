site_name: OpenDX-OS
site_description: Composable three-tier platform for business applications.
site_url: https://nguyentin05.github.io/opendx-os/
repo_url: https://github.com/nguyentin05/opendx-os
repo_name: nguyentin05/opendx-os
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

# Internal material stays in the repository but is never published.
# mkdocs.en.yml repeats this list and adds `*.vi.md`.
exclude_docs: |
  /README.md
  /*.py
  /__pycache__/
  /_internal/
  /overrides/
  /_snippets/
  /superpowers/

theme:
  name: material
  custom_dir: docs/overrides
  # Vietnamese is the default site language; mkdocs.en.yml builds English.
  language: vi
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  # Search is Algolia DocSearch (extra.algolia, docs/overrides/main.html).
  # Link preview images; needs Cairo. Set DOCS_SOCIAL=false to skip locally.
  - social:
      enabled: !ENV [DOCS_SOCIAL, true]
  - llmstxt:
      markdown_description: >-
        OpenDX-OS is a composable three-tier platform where business applications
        are declarative packages (manifest, workflows, knowledge) installed by an
        operator onto shared capabilities and infrastructure.
      sections:
        Get started:
          - get-started/*.md
        Guides:
          - guides/*.md
          - guides/knowledge/*.md
        Reference:
          - reference/*.md
          - reference/*/*.md
        Architecture and decisions:
          - architecture/*.md
          - adr/*.md
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      strict: false  # uncommitted pages have no git date yet; not an error
      type: date
      exclude:
        - "_internal/**"
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        contracts/data-contracts.md: reference/data-contracts/index.md
        contracts/security-and-acceptance.md: reference/security/index.md
        contracts/rag-api.proposed.md: reference/rag/api.md
        development/adding-an-app.md: guides/adding-an-app.md
        development/ui-integration.md: guides/integrating-the-ui.md
        development/package-knowledge.md: guides/knowledge/package-knowledge.md
        development/personal-library.md: guides/knowledge/personal-library.md
        development/model-knowledge.md: guides/knowledge/models.md
        development/verification.md: contribute/verification.md
        development/source-hygiene.md: contribute/source-hygiene.md
        development/releasing.md: contribute/releasing.md
        architecture/rag-authorization-proposal.md: reference/rag/authorization.md
        operations/runbook.md: operations/backup-restore.md

hooks:
  - docs/status_banner.py
  - docs/i18n.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Appends the glossary to every page so abbreviations get a tooltip.
  - pymdownx.snippets:
      check_paths: true
      auto_append:
        - docs/_snippets/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

extra:
  # Algolia DocSearch. The key is the search-only key, safe to publish.
  algolia:
    app_id: EP0ZG5RPLO
    api_key: 9d8d2a626f586479d35bceb349b4e464
    index_name: opendx_opendx-os crawler
    site_origin: https://nguyentin05.github.io
  # The logo and site title lead to the Vietnamese landing page (docs/index.html).
  homepage: /opendx-os/
  # Replaced per page by docs/i18n.py so switching keeps the current page.
  alternate:
    - name: Tiếng Việt
      link: ./
      lang: vi
    - name: English
      link: en/
      lang: en
  # Vietnamese navigation titles, applied by docs/i18n.py.
