site_name: OpenDX-OS
site_description: Composable three-tier platform for business applications.
site_url: https://nguyentin05.github.io/opendx-os/
repo_url: https://github.com/nguyentin05/opendx-os
repo_name: nguyentin05/opendx-os
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

# Internal material stays in the repository but is never published.
exclude_docs: |
  /README.md
  /_internal/
  /superpowers/
  *.vi.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
  - minify:
      minify_html: true
  - redirects:
      redirect_maps: {}

hooks:
  - hooks/status_banner.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    # Legacy pages still link to repository files outside docs_dir. Phase 4
    # turns these checks back on once the content migration is complete.
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Overview: get-started/index.md
      - Prerequisites: get-started/prerequisites.md
      - Run the local stack: get-started/local-stack.md
      - First request: get-started/first-request.md
  - Guides:
      - Overview: guides/index.md
      - Adding an application: guides/adding-an-app.md
      - Integrating the UI: guides/integrating-the-ui.md
      - Running workflows: guides/running-workflows.md
      - Knowledge:
          - Package knowledge: guides/knowledge/package-knowledge.md
          - Personal library: guides/knowledge/personal-library.md
          - Model answers: guides/knowledge/models.md
  - Reference:
      - Overview: reference/index.md
      - Runtime rules: reference/runtime-rules.md
      - Manifest: reference/manifest/index.md
      - Data contracts: reference/data-contracts/index.md
      - Security and acceptance: reference/security/index.md
      - API: reference/api/index.md
      - dxos-operator CLI: reference/cli/dxos-operator.md
      - RAG: reference/rag/index.md
  - Architecture:
