[project]
name = "dxos-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "celery==5.7.0",
    "cryptography",
    "docling",
    "fastapi",
    "haystack-ai",
    "httpx",
    "httpx2",
    "kombu[pgmq]==5.7.0",
    "langgraph",
    "litellm",
    "openai",
    "pgvector",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt[crypto]",
    "sqlalchemy>=2,<3",
    "torch",
    "torchvision",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
