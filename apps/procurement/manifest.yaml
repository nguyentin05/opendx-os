apiVersion: dxos.io/v1alpha1
kind: DXApplication
metadata:
  name: procurement
  displayName: "Material Procurement"
  version: "0.1.0"
spec:
  role: role_procurement
  sharedAccess:
    - table: core.employees
      roles: [role_procurement, role_manager_procurement]
      columns: [id, workspace_id, full_name, email, department]
    - table: core.work_items
      roles: [role_procurement, role_manager_procurement]
      columns: [id, workspace_id, title, description, priority, created_at]
    - table: core.file_objects
      roles: [role_procurement, role_manager_procurement]
      columns: [id, workspace_id, file_name, scan_status, sha256_hash, scanned_at]
  domainTable:
    name: domain.procurement_requests
    columns:
      - name: requester_id
        type: uuid
        nullable: false
      - name: vendor_name
        type: text
        nullable: false
        check: "length(trim(vendor_name)) > 0"
      - name: item_description
        type: text
        nullable: false
        check: "length(trim(item_description)) > 0"
      - name: quoted_amount
        type: numeric(14,2)
        nullable: false
        check: "quoted_amount > 0"
      - name: quote_file_id
        type: uuid
        nullable: true
      - name: ai_policy_summary
        type: text
        nullable: true
      - name: rejection_reason
        type: text
        nullable: true
    compositeForeignKeys:
      - columns: [workspace_id, work_item_id]
        referencesTable: core.work_items
        referencesColumns: [workspace_id, id]
      - columns: [workspace_id, requester_id]
        referencesTable: core.employees
        referencesColumns: [workspace_id, id]
      - columns: [workspace_id, quote_file_id]
        referencesTable: core.file_objects
        referencesColumns: [workspace_id, id]
  domainAccess:
    select:
      - role: role_procurement
        columns: [id, workspace_id, work_item_id, requester_id, vendor_name, item_description, quoted_amount, quote_file_id, ai_policy_summary, rejection_reason, status, version, updated_at]
      - role: role_manager_procurement
        columns: [id, workspace_id, work_item_id, requester_id, vendor_name, item_description, quoted_amount, quote_file_id, ai_policy_summary, rejection_reason, status, version, updated_at]
    insert:
      - role: role_procurement
        columns: [work_item_id, requester_id, vendor_name, item_description, quoted_amount, quote_file_id]
    update:
      - role: role_procurement
        columns: [vendor_name, item_description, quoted_amount, quote_file_id]
  stateMachine:
    initial: DRAFT
    editableStates: [DRAFT]
    terminalStates: [APPROVED, REJECTED, CANCELLED]
    commands:
      - name: submit
        from: [DRAFT]
        to: SUBMITTED
        allowedRoles: [role_procurement]
      - name: approve
        from: [SUBMITTED]
        to: APPROVED
        allowedRoles: [role_manager_procurement]
      - name: reject
        from: [SUBMITTED]
        to: REJECTED
        allowedRoles: [role_manager_procurement]
      - name: cancel
        from: [DRAFT, SUBMITTED]
        to: CANCELLED
        allowedRoles: [role_procurement, role_manager_procurement]
  attachments:
    - column: quote_file_id
      requireCleanOnCommands: [submit, approve]
  workflows:
    - id: procurement_approval_flow
      file: workflows/procurement_flow.yaml
      subscribedEvents:
        - command.committed
  capabilities:
    - cap-process
    - cap-data
    - cap-ai
  uiSchema:
    listColumns: [vendor_name, item_description, quoted_amount, quote_file_id, status, version, updated_at]
    formFields:
      - { name: work_item_id, label: "Work Item", type: uuid, required: true }
      - { name: requester_id, label: "Requester", type: uuid, required: true }
      - { name: vendor_name, label: "Vendor Name", type: text, required: true }
      - { name: item_description, label: "Item Description", type: text, required: true }
      - { name: quoted_amount, label: "Quoted Amount", type: number, required: true }
      - { name: quote_file_id, label: "Supplier Quote File", type: file, required: false }
    actions: [submit, approve, reject, cancel]
