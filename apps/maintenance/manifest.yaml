apiVersion: dxos.io/v1alpha1
kind: DXApplication
metadata:
  name: maintenance
  displayName: "Equipment Maintenance"
  version: "0.2.0"
spec:
  capabilities: [cap-process, cap-hr, cap-data]
  roles:
    - name: role_maintenance_technician
      description: Records and works on maintenance tasks
    - name: role_maintenance_manager
      description: Closes or cancels the maintenance tasks of their department
  sharedAccess:
    - table: core.users
      roles: [role_maintenance_technician, role_maintenance_manager]
      columns: [id, display_name]
    - table: cap_data.devices
      roles: [role_maintenance_technician, role_maintenance_manager]
      columns: [id, device_code, name, location, status, last_reading]
  domainTable:
    name: domain.maintenance_records
    columns:
      - name: assignee_id
        type: uuid
        nullable: false
      - name: device_id
        type: uuid
        nullable: true
      - name: issue_summary
        type: text
        nullable: false
        check: "length(trim(issue_summary)) > 0"
      - name: resolution_note
        type: text
        nullable: true
    foreignKeys:
      - { column: assignee_id, references: core.users }
      - { column: device_id, references: cap_data.devices }
  domainAccess:
    select:
      - role: role_maintenance_technician
        scope: department
        columns: [id, created_by, org_unit_id, assignee_id, device_id, issue_summary, resolution_note, status, version, updated_at]
      - role: role_maintenance_manager
        scope: department
        columns: [id, created_by, org_unit_id, assignee_id, device_id, issue_summary, resolution_note, status, version, updated_at]
    insert:
      - role: role_maintenance_technician
        columns: [assignee_id, device_id, issue_summary, resolution_note]
    update:
      - role: role_maintenance_technician
        scope: department
        columns: [issue_summary, resolution_note]
  stateMachine:
    initial: OPEN
    editableStates: [OPEN, IN_PROGRESS]
    terminalStates: [CLOSED, CANCELLED]
    commands:
      - name: submit
        from: [OPEN]
        to: IN_PROGRESS
        allowedRoles: [role_maintenance_technician]
      - name: close
        from: [IN_PROGRESS]
        to: CLOSED
        allowedRoles: [role_maintenance_manager]
      - name: cancel
        from: [OPEN, IN_PROGRESS]
        to: CANCELLED
        allowedRoles: [role_maintenance_manager]
  uiSchema:
    listColumns: [issue_summary, assignee_id, device_id, status, version, updated_at]
    formFields:
      - { name: assignee_id, label: "Assigned Technician", type: uuid, required: true }
      - { name: device_id, label: "Equipment / Device", type: uuid, required: false }
      - { name: issue_summary, label: "Issue Summary", type: text, required: true }
      - { name: resolution_note, label: "Resolution Note", type: text, required: false }
    actions: [submit, close, cancel]
