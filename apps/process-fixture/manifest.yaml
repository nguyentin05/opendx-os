# Independent fixture for cap-process tests: no cap-hr, so reviewers see the
# whole organization and requesters their own records.
apiVersion: dxos.io/v1alpha1
kind: DXApplication
metadata:
  name: process_fixture
  displayName: Independent Review Fixture
  version: 0.2.0
spec:
  capabilities:
  - cap-process
  - cap-work
  roles:
  - name: role_review
    description: Creates and submits review requests
  - name: role_review_manager
    description: Decides review requests
  sharedAccess:
  - table: core.users
    roles:
    - role_review
    - role_review_manager
    columns:
    - id
    - display_name
  - table: core.files
    roles:
    - role_review
    - role_review_manager
    columns:
    - id
    - file_name
    - scan_status
  tables:
  - name: domain.review_requests
    columns:
    - name: vendor_name
      type: text
      nullable: false
      check: length(trim(vendor_name)) > 0
    - name: item_description
      type: text
      nullable: false
      check: length(trim(item_description)) > 0
    - name: quoted_amount
      type: numeric(14,2)
      nullable: false
      check: quoted_amount > 0
    - name: quote_file_id
      type: uuid
      nullable: true
    - name: rejection_reason
      type: text
      nullable: true
    foreignKeys:
    - column: quote_file_id
      references: core.files
    access:
      select:
      - role: role_review
        scope: own
        columns:
        - id
        - created_by
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
        - rejection_reason
        - status
        - version
        - updated_at
      - role: role_review_manager
        scope: organization
        columns:
        - id
        - created_by
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
        - rejection_reason
        - status
        - version
        - updated_at
      insert:
      - role: role_review
        columns:
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
      update:
      - role: role_review
        scope: own
        columns:
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
    stateMachine:
      initial: OPEN
      editableStates:
      - OPEN
      terminalStates:
      - DONE
      - DECLINED
      - WITHDRAWN
      commands:
      - name: submit
        from:
        - OPEN
        to: IN_REVIEW
        allowedRoles:
        - role_review
      - name: approve
        from:
        - IN_REVIEW
        to: DONE
        allowedRoles:
        - role_review_manager
        recordFilter:
          created_by:
            _neq: X-Hasura-User-Id
      - name: reject
        from:
        - IN_REVIEW
        to: DECLINED
        allowedRoles:
        - role_review_manager
      - name: cancel
        from:
        - OPEN
        - IN_REVIEW
        to: WITHDRAWN
        allowedRoles:
        - role_review
        - role_review_manager
    attachments:
    - column: quote_file_id
      requireCleanOnCommands:
      - submit
      - approve
    ui:
      listColumns:
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      - status
      - version
      - updated_at
      formFields:
      - name: vendor_name
        label: Vendor Name
        type: text
        required: true
      - name: item_description
        label: Item Description
        type: text
        required: true
      - name: quoted_amount
        label: Quoted Amount
        type: number
        required: true
      - name: quote_file_id
        label: Supplier Quote File
        type: file
        required: false
      actions:
      - submit
      - approve
      - reject
      - cancel

  workflows:
  - id: review_flow
    file: workflows/review_flow.yaml
    subscribedEvents:
    - command.committed
    effects:
    - stepName: create_review
      kind: create_work_item
      whenCommands:
      - submit
      fields:
        title: Review fixture request
        description: Review the submitted request in its source application.
        priority: MEDIUM
