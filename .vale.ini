# Prose lint for English documentation. Vietnamese translations and internal
# notes are not checked. Run `vale sync` once to download the Google style.
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = OpenDX
Packages = Google

[docs/**/*.md]
BasedOnStyles = Vale, Google
# Product names, identifiers, and code dominate these pages; spelling is noise.
Vale.Spelling = NO
# Logical punctuation outside quotes is this project's style.
Google.Quotes = NO

# ADRs are historical records; their original wording is preserved.
[docs/adr/*.md]
BasedOnStyles =

[docs/**/*.vi.md]
BasedOnStyles =

[docs/_internal/**]
BasedOnStyles =
