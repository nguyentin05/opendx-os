# Minimal lint set shared by both Go modules (operator/ and capabilities/).
# CI runs golangci-lint from the repository root with this file.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  # shortcut: drop new-from-rev when #85 (52 pre-existing findings) is fixed.
  new-from-rev: fff3f03
