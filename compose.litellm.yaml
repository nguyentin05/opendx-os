# Opt-in overlay for the private model proxy. Add it after compose.models.yaml.
# Leaving it out starts no proxy and leaves every model-calling service unchanged.
#
# The proxy is infrastructure, not a capability: it publishes no host port, has no
# APISIX route, no database, no Admin UI, no Docker socket and no writable path of
# its own. The two model-calling services reach it only over the private
# `model-inference` network, and only with the proxy credential. Upstream provider
# keys exist only in the proxy container: the runtime never holds one.
#
# Required deployment settings (each names a private path or file, never a secret
# value in this file):
#   RAG_MODEL_LITELLM_IMAGE                pinned image reference (default below)
#   RAG_MODEL_LITELLM_CONFIG_FILE          the host path of the configuration
#                                          generated from the deployment
#                                          declaration by models.RenderProxyConfig.
#                                          Note the two meanings: Compose reads it
#                                          here as the *source file* of the
#                                          `litellm-config` secret, while the two
#                                          model-calling services below override it
#                                          to the *mounted* path inside the
#                                          container (/run/secrets/litellm-config.yaml).
#                                          They are the same document, and the
#                                          runtime verifies the mounted one.
#   RAG_MODEL_LITELLM_SECRET_ENV_FILE      owner-only env file holding
#                                          LITELLM_MASTER_KEY and the provider key
#                                          references the configuration names
#   RAG_MODEL_LITELLM_CREDENTIAL_ENV_FILE  owner-only env file holding the same
#                                          LITELLM_MASTER_KEY for the runtime
#
# Telemetry is an environment requirement, not a configuration key: the pinned
# proxy reads it from `LITELLM_TELEMETRY_*` (litellm/proxy/telemetry/settings.py),
# and `LITELLM_TELEMETRY_DISABLED=true` is the veto that keeps a stored consent or
# a future default from reporting anything. The pinned version honours no other
# telemetry disable variable, so no equivalent is invented here.
#
# Egress is closed by default: `model-inference` is `internal`, so the proxy has no
# route out of the deployment and a local-only installation cannot reach hosted
# inference even if a configuration asked it to. Two consequences are deliberate
# and must be reviewed before a deployment changes them:
#   * A deployment that declares a hosted route, or a local route whose endpoint
#     lives outside this Compose project, must attach the proxy to an egress or
#     external network from its own reviewed overlay. This file does not attach
#     one, because attaching it by default would make the local-only case
#     unprovable.
#   * The proxy publishes no host port. Operators inspect it through the Compose
#     network only; there is no port to publish.
#
# Transit from the runtime to the proxy is plaintext HTTP carrying a bearer
# credential. ADR 0011 accepts that as existing trusted infrastructure: the
# credential authenticates the client, `model-inference` is `internal` so the hop
# never leaves the host's bridge, and the network attaches only the proxy and the
# two model-calling services, neither of which publishes a port. It is
# authenticated but not encrypted, and the operator's threat model decides
# whether that is enough: a deployment that requires encryption adds a reviewed
# overlay (T7) that terminates TLS at the proxy and points
# RAG_MODEL_LITELLM_ENDPOINT at https; this file does not claim to carry one and
# ships no CA or certificate secret. The proxy's own upstream hop is a separate
# setting: a hosted route's `api_base` is HTTPS and the proxy verifies it against
# the image trust store.
services:
  litellm:
    image: ${RAG_MODEL_LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:1050d2c9ca58399de9cd51df6eb503812af697717f54d2f08c1c30589c75e1f7}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The image defaults to UID 0; the proxy needs no privilege at all.
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${RAG_MODEL_LITELLM_SECRET_ENV_FILE:?set the private env file holding LITELLM_MASTER_KEY and the provider key references}
    environment:
      HOME: /tmp
      # The pinned proxy loads its configuration from this variable and only when
      # the path ends in .yaml: a differently named mount loads no model at all.
      CONFIG_FILE_PATH: /run/secrets/litellm-config.yaml
      # Owned telemetry requirement (ADR 0011): the only disable switch this
      # release honours.
      LITELLM_TELEMETRY_DISABLED: "true"
      # No self-initiated egress. Without these the pinned proxy fetches its model
      # cost map, blog posts, release notes and autorouter presets from the public
      # internet at startup, which a local-only deployment must not do. Offline mode
      # covers every such fetch; the explicit variable names the one that was
      # observed making real requests.
      LITELLM_OFFLINE_MODE: "true"
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
    secrets:
      # The target is the mount name inside /run/secrets, so it must equal the
      # basename of CONFIG_FILE_PATH: a differently named target is mounted at
      # /run/secrets/<source> and the pinned proxy loads no route at all.
      - source: litellm-config
        target: litellm-config.yaml
    networks:
      model-inference:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Deliberately absent: ports, expose, volumes, privileged, network_mode,
    # pid, ipc, DATABASE_URL, STORE_MODEL_IN_DB and every callback or cache.

  cap-ai:
    environment:
      RAG_MODEL_LITELLM_ENDPOINT: http://litellm:4000
      # The runtime verifies the proxy configuration it believes in against
      # exactly the document the proxy started, so it reads the same read-only
      # mount instead of a host path that does not exist in the container.
      RAG_MODEL_LITELLM_CONFIG_FILE: /run/secrets/litellm-config.yaml
    env_file:
      - ${RAG_MODEL_LITELLM_CREDENTIAL_ENV_FILE:?set the private env file holding the proxy credential for the runtime}
    secrets:
      # The target is the mount name inside /run/secrets and must match the
      # runtime's RAG_MODEL_LITELLM_CONFIG_FILE above.
      - source: litellm-config
        target: litellm-config.yaml
    networks:
      # Declaring networks replaces the implicit default one, so both are
      # explicit: the proxy hop stays on the private model network while the API
      # keeps its database, Keycloak and capability network.
      - default
      - model-inference

  cap-ai-worker:
    environment:
      RAG_MODEL_LITELLM_ENDPOINT: http://litellm:4000
      RAG_MODEL_LITELLM_CONFIG_FILE: /run/secrets/litellm-config.yaml
    env_file:
      - ${RAG_MODEL_LITELLM_CREDENTIAL_ENV_FILE:?set the private env file holding the proxy credential for the runtime}
    secrets:
      - source: litellm-config
        target: litellm-config.yaml
    networks:
      - default
      - model-inference

# `internal` is the egress control: a container attached only to this network has
# no route out of the deployment. See the header before adding an egress network.
networks:
  model-inference:
    name: dxos-model-inference
    internal: true

secrets:
  litellm-config:
    file: ${RAG_MODEL_LITELLM_CONFIG_FILE:?set the generated proxy configuration path}
