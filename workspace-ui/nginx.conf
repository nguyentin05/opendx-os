# A WebSocket upgrade (GraphQL subscriptions) passes through; plain requests
# keep their usual connection handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The image renders this file as a template: ${DXOS_OIDC_*} are environment
    # variables, nginx variables such as $gateway stay as they are.
    # No location below sets add_header, so every response inherits these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ${DXOS_OIDC_ORIGIN}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(api/(auth|cap)/|v1/graphql$) {
        resolver 127.0.0.11 valid=5s;
        set $gateway apisix:9080;
        proxy_pass http://$gateway$request_uri;
        # A stopped gateway must fail fast; long commands still get 490 s to answer.
        proxy_connect_timeout 3s;
        proxy_read_timeout 490s;
        client_max_body_size 21m;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Sign-in settings of this deployment, loaded by index.html before the app,
    # so one image serves any host. Not cached: it changes with the deployment.
    location = /config.js {
        default_type application/javascript;
        expires -1;
        return 200 'window.DXOS_CONFIG={issuer:"${DXOS_OIDC_ISSUER}",clientID:"${DXOS_OIDC_CLIENT_ID}"};';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
