apiVersion: dxos.io/v1alpha1
kind: DXApplication
metadata:
  name: procurement
  displayName: Material Procurement
  version: 0.3.0
spec:
  capabilities:
  - cap-process
  - cap-hr
  - cap-work
  roles:
  - name: role_procurement_requester
    description: Creates and submits purchase requests
  - name: role_procurement_manager
    description: Approves the purchase requests of their own department
  - name: role_procurement_finance
    description: Reviews the budget of requests approved by a department
  sharedAccess:
  - table: core.users
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    columns:
    - id
    - display_name
    - email
  - table: cap_hr.org_units
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    columns:
    - id
    - code
    - name
  - table: core.files
    roles:
    - role_procurement_requester
    - role_procurement_manager
    - role_procurement_finance
    columns:
    - id
    - file_name
    - scan_status
    - sha256_hash
    - scanned_at
  tables:
  - name: domain.procurement_requests
    columns:
    - name: vendor_name
      type: text
      nullable: false
      check: length(trim(vendor_name)) > 0
    - name: item_description
      type: text
      nullable: false
      check: length(trim(item_description)) > 0
    - name: quoted_amount
      type: numeric(14,2)
      nullable: false
      check: quoted_amount > 0
    - name: quote_file_id
      type: uuid
      nullable: true
    - name: rejection_reason
      type: text
      nullable: true
    - name: vendor_id
      type: uuid
      nullable: true
    foreignKeys:
    - column: quote_file_id
      references: core.files
    - column: vendor_id
      references: domain.procurement_vendors
    access:
      select:
      - role: role_procurement_requester
        scope: own
        columns: &procurement_columns
        - id
        - created_by
        - org_unit_id
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
        - rejection_reason
        - vendor_id
        - status
        - version
        - created_at
        - updated_at
      # A draft is the requester's own until it is submitted.
      - role: role_procurement_manager
        scope: department
        columns: *procurement_columns
        recordFilter:
          status:
            _neq: DRAFT
      - role: role_procurement_finance
        scope: organization
        columns: *procurement_columns
        recordFilter:
          status:
            _neq: DRAFT
      insert:
      - role: role_procurement_requester
        columns:
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
        - vendor_id
      update:
      - role: role_procurement_requester
        scope: own
        columns:
        - vendor_name
        - item_description
        - quoted_amount
        - quote_file_id
        - vendor_id
    stateMachine:
      initial: DRAFT
      editableStates:
      - DRAFT
      terminalStates:
      - APPROVED
      - REJECTED
      - CANCELLED
      commands:
      - name: submit
        from:
        - DRAFT
        to: SUBMITTED
        allowedRoles:
        - role_procurement_requester
      - name: approve
        from:
        - SUBMITTED
        to: BUDGET_REVIEW
        allowedRoles:
        - role_procurement_manager
        recordFilter:
          created_by:
            _neq: X-Hasura-User-Id
      - name: approve_budget
        from:
        - BUDGET_REVIEW
        to: APPROVED
        allowedRoles:
        - role_procurement_finance
        recordFilter:
          created_by:
            _neq: X-Hasura-User-Id
      - name: reject
        from:
        - SUBMITTED
        - BUDGET_REVIEW
        to: REJECTED
        allowedRoles:
        - role_procurement_manager
        - role_procurement_finance
      - name: cancel
        from:
        - DRAFT
        - SUBMITTED
        to: CANCELLED
        allowedRoles:
        - role_procurement_requester
    attachments:
    - column: quote_file_id
      requireCleanOnCommands:
      - submit
      - approve
      - approve_budget
    ui:
      listColumns:
      - vendor_name
      - item_description
      - quoted_amount
      - quote_file_id
      - status
      - version
      - updated_at
      formFields:
      - name: vendor_name
        label: Vendor Name
        type: text
        required: true
      - name: item_description
        label: Item Description
        type: text
        required: true
      - name: quoted_amount
        label: Quoted Amount
        type: number
        required: true
      - name: quote_file_id
        label: Supplier Quote File
        type: file
        required: false
      actions:
      - submit
      - approve
      - approve_budget
      - reject
      - cancel
  # A list the application maintains: finance keeps it, everyone reads it.
  - name: domain.procurement_vendors
    columns:
    - name: name
      type: text
      nullable: false
      check: length(trim(name)) > 0
    - name: tax_code
      type: text
      nullable: true
    access:
      select:
      - role: role_procurement_requester
        scope: organization
        columns: &vendor_columns
        - id
        - name
        - tax_code
        - version
        - updated_at
      - role: role_procurement_manager
        scope: organization
        columns: *vendor_columns
      - role: role_procurement_finance
        scope: organization
        columns: *vendor_columns
      insert:
      - role: role_procurement_finance
        columns:
        - name
        - tax_code
      update:
      - role: role_procurement_finance
        scope: organization
        columns:
        - name
        - tax_code
    ui:
      listColumns:
      - name
      - tax_code
      formFields:
      - name: name
        label: Vendor Name
        type: text
        required: true
      - name: tax_code
        label: Tax Code
        type: text
        required: false
  # The lines of a request. They follow it: readable with the request, editable
  # while it is a draft, and every change increments the request's version.
  - name: domain.procurement_items
    belongsTo:
      table: domain.procurement_requests
      column: request_id
    columns:
    - name: item
      type: text
      nullable: false
      check: length(trim(item)) > 0
    - name: quantity
      type: numeric(14,2)
      nullable: false
      check: quantity > 0
    - name: unit_price
      type: numeric(14,2)
      nullable: false
      check: unit_price > 0
    access:
      select:
      - role: role_procurement_requester
        columns: &item_columns
        - id
        - request_id
        - item
        - quantity
        - unit_price
        - version
        - updated_at
      - role: role_procurement_manager
        columns: *item_columns
      - role: role_procurement_finance
        columns: *item_columns
      insert:
      - role: role_procurement_requester
        columns: &item_fields
        - item
        - quantity
        - unit_price
      update:
      - role: role_procurement_requester
        columns: *item_fields
      delete:
      - role: role_procurement_requester
    ui:
      listColumns:
      - item
      - quantity
      - unit_price
      formFields:
      - name: item
        label: Item
        type: text
        required: true
      - name: quantity
        label: Quantity
        type: number
        required: true
      - name: unit_price
        label: Unit Price
        type: number
        required: true
  workflows:
  - id: procurement_approval_flow
    file: workflows/procurement_flow.yaml
    subscribedEvents:
    - command.committed
    effects:
    - stepName: create_review
      kind: create_work_item
      whenCommands:
      - submit
      fields:
        title: Review procurement request
        description: Review the submitted request in its source application.
        priority: MEDIUM
