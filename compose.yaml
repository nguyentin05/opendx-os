name: opendx-os

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dxos_db}
      ENABLED_CAPABILITIES: ${ENABLED_CAPABILITIES:-cap-process,cap-hr,cap-work,cap-data}
      # Login passwords for the runtime roles, applied by 08_runtime_passwords.sh.
      HASURA_DATABASE_PASSWORD: ${HASURA_DATABASE_PASSWORD:-change-me-local-hasura-db}
      PROCESS_DATABASE_PASSWORD: ${PROCESS_DATABASE_PASSWORD:-change-me-local-process-db}
      KESTRA_DATABASE_PASSWORD: ${KESTRA_DATABASE_PASSWORD:-change-me-local-kestra-database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./platform/postgres/init/01_core_schema.sql:/docker-entrypoint-initdb.d/01_core_schema.sql:ro
      - ./platform/postgres/init/02_capability_registry.sql:/docker-entrypoint-initdb.d/02_capability_registry.sql:ro
      - ./platform/postgres/init/03_app_registry.sql:/docker-entrypoint-initdb.d/03_app_registry.sql:ro
      - ./platform/postgres/init/04_capabilities.sh:/docker-entrypoint-initdb.d/04_capabilities.sh:ro
      - ./platform/postgres/init/05_operator_deployments.sql:/docker-entrypoint-initdb.d/05_operator_deployments.sql:ro
      - ./platform/postgres/init/06_runtime_roles.sql:/docker-entrypoint-initdb.d/06_runtime_roles.sql:ro
      - ./platform/postgres/init/07_app_definitions.sql:/docker-entrypoint-initdb.d/07_app_definitions.sql:ro
      - ./platform/postgres/init/08_runtime_passwords.sh:/docker-entrypoint-initdb.d/08_runtime_passwords.sh:ro
      - ./platform/postgres/capabilities:/docker-entrypoint-initdb.d/capabilities:ro
    healthcheck:
      # TCP, not the socket: the init-time server listens on the socket only, so
      # this passes once init scripts have finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dxos_admin} -d ${POSTGRES_DB:-dxos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1
    restart: unless-stopped
    ports:
      - "${HASURA_PORT:-8080}:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://dxos_hasura:${HASURA_DATABASE_PASSWORD:-change-me-local-hasura-db}@postgres:5432/${POSTGRES_DB:-dxos_db}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-dxos_admin_secret}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}","issuer":"${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}","audience":"${OIDC_AUDIENCE:-dxos-runtime}"}'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8085
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8085}:8085"
    volumes:
      - ./platform/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # Hasura and cap-process fetch the realm's signing keys at startup, so they
    # wait for this. The image has no curl; bash talks to the management port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweedfs-data:/data
      - ./platform/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 50M
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 12
    volumes:
      - clamav-data:/var/lib/clamav

  kestra:
    image: kestra/kestra:v0.20.7
    restart: unless-stopped
    command: server standalone --config /app/config/config.yaml
    environment:
      KESTRA_DATABASE_PASSWORD: ${KESTRA_DATABASE_PASSWORD:-change-me-local-kestra-database}
      KESTRA_USER: ${KESTRA_USER:-admin@dxos.local}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:-change-me-local-kestra}
    ports:
      - "${KESTRA_PORT:-8082}:8080"
    volumes:
      - kestra-data:/app/storage
      - ./platform/kestra/config.yaml:/app/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  cap-process:
    build:
      context: ./capabilities
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://dxos_process:${PROCESS_DATABASE_PASSWORD:-change-me-local-process-db}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dxos-runtime}
      WORKFLOW_SERVICE_USER_ID: ${WORKFLOW_SERVICE_USER_ID:-22222222-2222-4222-8222-000000000005}
      WORKFLOW_SERVICE_ROLE: ${WORKFLOW_SERVICE_ROLE:-role_workflow}
      KESTRA_URL: ${KESTRA_URL:-http://kestra:8080/api/v1/executions/webhook/dxos/procurement_approval_flow/webhook-key}
      KESTRA_API_TOKEN: ${KESTRA_API_TOKEN:-change-me-local-kestra-token}
      KESTRA_AUTH_SCHEME: ${KESTRA_AUTH_SCHEME:-Bearer}
      KESTRA_ROUTES_FILE: ${KESTRA_ROUTES_FILE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-dxos-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dxos_s3_access_key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dxos_s3_secret_key}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-clamav:3310}
    ports:
      - "${CAP_PROCESS_PORT:-8091}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      clamav:
        condition: service_healthy
      kestra:
        condition: service_started

  apisix:
    image: apache/apisix:3.10.0-debian
    restart: unless-stopped
    ports:
      - "${APISIX_GATEWAY_PORT:-9080}:9080"
      - "9092:9092"
    volumes:
      - ./platform/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./platform/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - hasura
      - cap-process
      - keycloak

  workspace-ui:
    build:
      context: ./workspace-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WORKSPACE_UI_PORT:-5173}:80"
    depends_on:
      - apisix

volumes:
  pg-data:
  seaweedfs-data:
  clamav-data:
  kestra-data:
