name: opendx-os

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dxos_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./platform/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./platform/postgres/capabilities:/docker-entrypoint-initdb.d/capabilities:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxos_admin -d dxos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1
    restart: unless-stopped
    ports:
      - "${HASURA_PORT:-8080}:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-dxos_admin}:${POSTGRES_PASSWORD:-dxos_secret}@postgres:5432/${POSTGRES_DB:-dxos_db}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-dxos_admin_secret}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8085
    ports:
      - "${KEYCLOAK_PORT:-8085}:8085"
    volumes:
      - ./platform/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  apisix:
    image: apache/apisix:3.10.0-debian
    restart: unless-stopped
    ports:
      - "${APISIX_GATEWAY_PORT:-9080}:9080"
      - "9092:9092"
    volumes:
      - ./platform/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./platform/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - hasura

volumes:
  pg-data:
