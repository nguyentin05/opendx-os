name: opendx-os

# Published ports listen on BIND_ADDRESS, 127.0.0.1 by default: the defaults
# below are local development secrets and must not be reachable from the
# network. Run scripts/init-env.sh to generate a .env with random secrets
# before setting BIND_ADDRESS to anything else.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dxos_db}
      ENABLED_CAPABILITIES: ${ENABLED_CAPABILITIES:-cap-process,cap-hr,cap-work,cap-data,cap-ai}
      # Login passwords for the runtime roles, applied by 08_runtime_passwords.sh.
      HASURA_DATABASE_PASSWORD: ${HASURA_DATABASE_PASSWORD:-change-me-local-hasura-db}
      PROCESS_DATABASE_PASSWORD: ${PROCESS_DATABASE_PASSWORD:-change-me-local-process-db}
      AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:-}
      AI_WORKER_DATABASE_PASSWORD: ${AI_WORKER_DATABASE_PASSWORD:-}
      AI_DISPATCHER_DATABASE_PASSWORD: ${AI_DISPATCHER_DATABASE_PASSWORD:-}
      AUTHZ_DATABASE_PASSWORD: ${AUTHZ_DATABASE_PASSWORD:-change-me-local-authz-db}
      HR_DATABASE_PASSWORD: ${HR_DATABASE_PASSWORD:-change-me-local-hr-db}
      KESTRA_DATABASE_PASSWORD: ${KESTRA_DATABASE_PASSWORD:-change-me-local-kestra-database}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./platform/postgres/init/01_core_schema.sql:/docker-entrypoint-initdb.d/01_core_schema.sql:ro
      - ./platform/postgres/init/02_capability_registry.sql:/docker-entrypoint-initdb.d/02_capability_registry.sql:ro
      - ./platform/postgres/init/03_app_registry.sql:/docker-entrypoint-initdb.d/03_app_registry.sql:ro
      - ./platform/postgres/init/04_capabilities.sh:/docker-entrypoint-initdb.d/04_capabilities.sh:ro
      - ./platform/postgres/init/05_operator_deployments.sql:/docker-entrypoint-initdb.d/05_operator_deployments.sql:ro
      - ./platform/postgres/init/06_runtime_roles.sql:/docker-entrypoint-initdb.d/06_runtime_roles.sql:ro
      - ./platform/postgres/init/07_app_definitions.sql:/docker-entrypoint-initdb.d/07_app_definitions.sql:ro
      - ./platform/postgres/init/08_runtime_passwords.sh:/docker-entrypoint-initdb.d/08_runtime_passwords.sh:ro
      - ./platform/postgres/capabilities:/docker-entrypoint-initdb.d/capabilities:ro
      - ./platform/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./platform/postgres/init/09_rag_migrations.sh:/docker-entrypoint-initdb.d/09_rag_migrations.sh:ro
    healthcheck:
      # TCP, not the socket: the init-time server listens on the socket only, so
      # this passes once init scripts have finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dxos_admin} -d ${POSTGRES_DB:-dxos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1-ce
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HASURA_PORT:-8080}:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://dxos_hasura:${HASURA_DATABASE_PASSWORD:-change-me-local-hasura-db}@postgres:5432/${POSTGRES_DB:-dxos_db}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-dxos_admin_secret}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      # Keycloak authenticates; dxos-authz decides the caller's role from
      # core.user_roles on each request (ADR 0007). Tokens carry no roles.
      HASURA_GRAPHQL_AUTH_HOOK: http://authz:8090/hasura
      HASURA_GRAPHQL_AUTH_HOOK_MODE: GET
    depends_on:
      postgres:
        condition: service_healthy
      authz:
        condition: service_healthy

  authz:
    build:
      context: ./capabilities
      additional_contexts:
        legal: .
      dockerfile: Dockerfile
      args:
        SERVICE: dxos-authz
    restart: unless-stopped
    environment:
      PORT: "8090"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dxos-authz}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DATABASE_URL: postgres://dxos_authz:${AUTHZ_DATABASE_PASSWORD:-change-me-local-authz-db}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dxos-runtime}
      ROLE_CACHE_TTL: ${ROLE_CACHE_TTL:-5s}
      # The account that becomes the first platform operator when it signs in
      # and nobody holds role_operator yet. Empty: no bootstrap.
      BOOTSTRAP_OPERATOR_EMAIL: ${BOOTSTRAP_OPERATOR_EMAIL:-}
      # Lists accounts that have not signed in yet (read-only, view-users) through
      # the Keycloak client set up by keycloak-directory. Empty: people appear at
      # their first sign-in.
      KEYCLOAK_URL: http://keycloak:8085
      KEYCLOAK_DIRECTORY_SECRET: ${KEYCLOAK_DIRECTORY_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Departments and staff (cap-hr): everyone reads their own place in the
  # organization, role_hr_admin maintains it.
  cap-hr:
    build:
      context: ./capabilities
      additional_contexts:
        legal: .
      dockerfile: Dockerfile
      args:
        SERVICE: cap-hr
    restart: unless-stopped
    environment:
      PORT: "8083"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cap-hr}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DATABASE_URL: postgres://dxos_hr:${HR_DATABASE_PASSWORD:-change-me-local-hr-db}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dxos-runtime}
      ROLE_CACHE_TTL: ${ROLE_CACHE_TTL:-5s}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      # Tracing is a preview feature in Keycloak 26.0; off until the operator
      # sets KC_TRACING_ENABLED and an endpoint.
      KC_FEATURES: ${KC_FEATURES:-opentelemetry}
      KC_TRACING_ENABLED: ${KC_TRACING_ENABLED:-false}
      KC_TRACING_ENDPOINT: ${KC_TRACING_ENDPOINT:-}
      KC_TRACING_PROTOCOL: ${KC_TRACING_PROTOCOL:-http/protobuf}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-false}
      KC_LOG_CONSOLE_OUTPUT: ${KC_LOG_CONSOLE_OUTPUT:-default}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens must carry the same issuer the services verify, even when they
      # are requested from another container over the internal hostname.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8085}
      # Address of the Workspace UI, allowed as a sign-in redirect by the realm import.
      DXOS_APP_URL: ${DXOS_APP_URL:-http://localhost:5173}
      KC_HTTP_PORT: 8085
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8085}:8085"
    volumes:
      # Users and sessions live here; the realm file is imported only into an
      # empty store, so restarts keep accounts created at run time.
      - keycloak-data:/opt/keycloak/data
      - ./platform/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # Hasura and cap-process fetch the realm's signing keys at startup, so they
    # wait for this. The image has no curl; bash talks to the management port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: creates or disables the read-only Keycloak client dxos-authz lists
  # users with (platform/keycloak/directory-client.sh), then exits.
  keycloak-directory:
    image: quay.io/keycloak/keycloak:26.0
    restart: "no"
    entrypoint: ["bash", "/opt/dxos/directory-client.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8085
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_DIRECTORY_SECRET: ${KEYCLOAK_DIRECTORY_SECRET:-}
    volumes:
      - ./platform/keycloak/directory-client.sh:/opt/dxos/directory-client.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweedfs-data:/data
      - ./platform/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 50M
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 12
    volumes:
      - clamav-data:/var/lib/clamav

  kestra:
    image: kestra/kestra:v0.20.7
    restart: unless-stopped
    # start.sh hands the platform's secrets to Kestra, then starts the server.
    entrypoint: ["/bin/bash", "/app/config/start.sh"]
    environment:
      KESTRA_DATABASE_PASSWORD: ${KESTRA_DATABASE_PASSWORD:-change-me-local-kestra-database}
      KESTRA_USER: ${KESTRA_USER:-admin@dxos.local}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:-change-me-local-kestra}
      DXOS_WEBHOOK_KEY: ${KESTRA_WEBHOOK_KEY:-change-me-local-webhook-key}
      DXOS_PROCESS_URL: http://cap-process:8081
      DXOS_WORKFLOW_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-change-me-local-workflow-service-token}
      KESTRA_OTEL_ENABLED: ${KESTRA_OTEL_ENABLED:-false}
      KESTRA_TRACES_ROOT: ${KESTRA_TRACES_ROOT:-DISABLED}
      KESTRA_OTLP_METRICS_ENABLED: ${KESTRA_OTLP_METRICS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      KESTRA_OTEL_ENDPOINT: ${KESTRA_OTEL_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KESTRA_PORT:-8082}:8080"
    volumes:
      - kestra-data:/app/storage
      - ./platform/kestra/config.yaml:/app/config/config.yaml:ro
      - ./platform/kestra/start.sh:/app/config/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$KESTRA_USER:$$KESTRA_PASSWORD\" http://127.0.0.1:8080/api/v1/configs"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    depends_on:
      postgres:
        condition: service_healthy

  # Installs exactly the application packages in ./apps and keeps them
  # installed: copy a package directory in to install it, remove it to
  # uninstall (its data is kept). No container needs recreating.
  operator:
    build:
      context: ./operator
      additional_contexts:
        legal: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["reconcile", "--dir", "/apps", "--interval", "${OPERATOR_RECONCILE_INTERVAL:-30s}"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dxos_admin}:${POSTGRES_PASSWORD:-dxos_secret}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      HASURA_URL: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-dxos_admin_secret}
      # Application workflows are deployed to Kestra and kept there.
      KESTRA_URL: http://kestra:8080
      KESTRA_USER: ${KESTRA_USER:-admin@dxos.local}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:-change-me-local-kestra}
    volumes:
      - ${OPERATOR_APPS_DIR:-./apps}:/apps:ro
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_healthy
      kestra:
        condition: service_healthy

  cap-process:
    build:
      context: ./capabilities
      additional_contexts:
        legal: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cap-process}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      DATABASE_URL: postgres://dxos_process:${PROCESS_DATABASE_PASSWORD:-change-me-local-process-db}@postgres:5432/${POSTGRES_DB:-dxos_db}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8085/realms/dxos/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dxos-runtime}
      WORKFLOW_SERVICE_USER_ID: ${WORKFLOW_SERVICE_USER_ID:-22222222-2222-4222-8222-000000000005}
      WORKFLOW_SERVICE_ROLE: ${WORKFLOW_SERVICE_ROLE:-role_workflow}
      # Events go to the flow the operator deployed for their application;
      # flows call back with the workflow service credential.
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-change-me-local-workflow-service-token}
      KESTRA_URL: http://kestra:8080
      KESTRA_USER: ${KESTRA_USER:-admin@dxos.local}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:-change-me-local-kestra}
      KESTRA_WEBHOOK_KEY: ${KESTRA_WEBHOOK_KEY:-change-me-local-webhook-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-dxos-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dxos_s3_access_key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dxos_s3_secret_key}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-clamav:3310}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CAP_PROCESS_PORT:-8091}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      clamav:
        condition: service_healthy
      kestra:
        condition: service_started

  apisix:
    image: apache/apisix:3.10.0-debian
    restart: unless-stopped
    environment:
      # Gateway spans are off until a Collector is set: with nothing listening,
      # every export attempt would log an error.
      OTEL_APISIX_SAMPLER: ${OTEL_APISIX_SAMPLER:-always_off}
      OTEL_COLLECTOR_ADDRESS: ${OTEL_COLLECTOR_ADDRESS:-127.0.0.1:4318}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APISIX_GATEWAY_PORT:-9080}:9080"
    volumes:
      - ./platform/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./platform/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - hasura
      - authz
      - cap-process
      - cap-hr
      - keycloak

  workspace-ui:
    build:
      context: ./workspace-ui
      additional_contexts:
        legal: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Realm the UI signs in with, and its origin the browser may call
      # (Content-Security-Policy connect-src).
      DXOS_OIDC_ISSUER: ${OIDC_ISSUER_URL:-http://localhost:8085/realms/dxos}
      DXOS_OIDC_ORIGIN: ${DXOS_OIDC_ORIGIN:-http://localhost:8085}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WORKSPACE_UI_PORT:-5173}:8080"
    depends_on:
      - apisix

volumes:
  pg-data:
  keycloak-data:
  seaweedfs-data:
  clamav-data:
  kestra-data:
