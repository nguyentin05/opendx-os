# Narrow allowlist for values gitleaks cannot distinguish from real credentials.
# Every entry must name the file and the exact text; nothing is exempted wholesale.
title = "OpenDX-OS gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Algolia DocSearch search-only key, published on purpose: it can only query the public index and cannot write to it."
paths = ['''^mkdocs\.yml$''']
regexTarget = "match"
regexes = ['''api_key:\s*9d8d2a626f586479d35bceb349b4e464''']

[[rules.allowlists]]
description = "ConfigMap entry whose key is the name of a bundled .sql migration, not a credential."
paths = ['''^platform/k8s/dev/postgres\.yaml$''']
regexTarget = "match"
regexes = ['''key:\s*cap_ai-0002_docir_fts\.sql''']

[[rules.allowlists]]
description = "Deterministic HMAC fixture used by the webhook routing unit test; never deployed."
paths = ['''^capabilities/internal/events/routing_test\.go$''']
regexTarget = "match"
regexes = ['''WebhookKey:\s*"0123456789abcdef"''']
